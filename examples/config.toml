#:schema https://raw.githubusercontent.com/LysCongThanh/heavyq/main/schema/config.schema.json
# heavyq configuration: ~/.config/heavyq/config.toml
# Every key is optional; the values below are the defaults unless marked "example".

[queue]
poll = "2s"              # how often a waiting ticket retries
force_after = "15m"      # anti-starvation: a head ticket with one candidate machine skips the load check (never RAM) after this
resource_gate = true     # false = only slots limit concurrency
auto = true              # tickets without --remote are placed by score when it is safe
load_weight_mb = 500     # score = free_mb - load_weight_mb * load1
hold_for = "1m"          # RAM budget of a just-started job stays reserved this long
remote_down_max = "10m"  # remote-only tickets exit 76 after their remotes are unreachable this long
probe_timeout = "5s"     # one remote metrics probe
base_ref = ""            # default --base-ref: "" = origin's default branch if the repo has one, "none" = no base ref, or e.g. "origin/main"

[local]
heavy_slots = 2
light_slots = 1
max_load_ratio = 0.75    # admit while load1 < ratio * cores
job_mb = 3072            # RAM budget of one heavy job
light_mb = 1024          # RAM budget of one --light job
reserve_mb = 2048        # headroom kept free on top of the budget
# Share slots with scripts that already use `flock /tmp/build-1.lock make`.
# When set, these files ARE the heavy slots (their count replaces heavy_slots).
# legacy_lock_files = ["/tmp/build-1.lock", "/tmp/build-2.lock"]   # example

# One [[remote]] block per spare machine (example). With no slot key set, a remote has 2 heavy and 0 light slots.
[[remote]]
name = "buildbox"        # used in --remote buildbox and in status
ssh = "buildbox"         # alias from ~/.ssh/config; key auth, ControlMaster recommended
heavy_slots = 2
light_slots = 2
max_load_ratio = 0.75
job_mb = 2048
light_mb = 1024
reserve_mb = 2048
work_dir = ".heavyq"     # remote dir (relative to the remote home): git/, wt/, slots/, cache/
# git_url = "buildbox:.heavyq/git"   # default: <ssh>:<work_dir>/git
# transport = ["ssh", "-o", "BatchMode=yes", "-o", "ConnectTimeout=10", "-o", "ServerAliveInterval=15", "-o", "ServerAliveCountMax=4", "buildbox"]   # default
#
# Directories put first on the remote command's PATH ("~/" = remote home). Mostly for a Mac
# whose login shell does not already set it (example).
# env_path = "~/.local/go-sdk/bin"
#
# Optional shell snippet run in the fresh worktree before the command.
# It gets HEAVYQ_CACHE_DIR (persistent, under work_dir) and HEAVYQ_WORKTREE.
# A non-zero exit aborts the run with exit code 77.
cache_hook = '''
[ -f package-lock.json ] || exit 0
key=$(sha256sum package-lock.json | cut -c1-16); c="$HEAVYQ_CACHE_DIR/nm-$key"
if [ -d "$c" ]; then cp -al "$c" node_modules; exit; fi
npm ci --no-audit --no-fund && { cp -al node_modules "$c.$$" && mv -T "$c.$$" "$c" || rm -rf "$c.$$"; } 2>/dev/null; true
'''

# Claude Code hook: `heavyq hook install claude`, then agents' heavy commands are
# rewritten into heavyq runs (see docs/claude-code.md).
[hook]
enabled = true
permission = ""          # "" = Claude Code asks/allows as usual; "allow" = approve rewritten commands
max_wait = "5m"          # --max-wait for rewritten commands; also added to the Bash tool timeout
binary = ""              # default: "heavyq" if on PATH, else this binary's absolute path
default_rules = true     # built-in rules (npm/pnpm/yarn test|build|lint..., go test, pytest, cargo, make, gradle, mvn)

# Your rules are checked before the built-in ones (example).
[[hook.rule]]
match = ["bun test", "deno task check"]   # whole-word prefixes of the command
priority = 3
light = false
lane = ""                # "" = $HEAVYQ_LANE, else the git work tree's name
cache = true             # add --cache

# Named pools: values a run holds while it runs (heavyq 4 --needs port:2,pg -- ...), all or none.
# The command gets HEAVYQ_PORT_1, HEAVYQ_PORT_2, HEAVYQ_PG. A pool in a repository's heavyq.toml
# with the same name replaces these. See docs/pools.md.
[[pool]]
name = "port"
values = "4100-4199"     # a range, or a list; ports are probed and never inside the OS ephemeral range
# port = true            # TCP ports; default: true for a pool called "port" or ending in "_port"

[[pool]]
name = "pg"
values = ["app_wt1", "app_wt2", "app_wt3"]

[[pool]]
name = "browser"
size = 2                 # capacity only: the values are 1 and 2

# Where `heavyq item done --run` and `heavyq gate run` run proofs. A [proof] table in a
# repository's heavyq.toml overrides it there; --remote overrides both.
[proof]
remote = "local"         # "local" (default) | "auto" (scheduler picks, free slots first) | a [[remote]] name | an ordered list "a,b,c" (the first with room)

# Defaults for `heavyq <prio> -- cmd`.
[run]
need_gh_repos = []       # repository directory names whose commands use this machine's GitHub CLI login: runs there stay here, as with --need-gh (example: ["infra"])

# The mentor experiment of `heavyq hook claude-posttooluse` (docs/mentor.md).
[mentor]
holdout_pct = 20         # share of eligible events logged but not shown, 0-100; 100 = shadow mode
auto_mute = true         # a rule that shows too little lift mutes itself
min_events = 200         # resolved events per arm before the lift is judged
min_lift_pp = 10.0       # lift, in percentage points, below which a rule is muted

# Result cache and coalescing for --cache runs.
[cache]
ttl = "24h"
max_size_mb = 512        # oldest entries are evicted beyond this
max_entry_mb = 64        # larger outputs are not stored
cache_failures = false   # true = also replay non-zero exits to later runs
env = []                 # variables whose values are part of the key, e.g. ["CI", "NODE_ENV"]

# `heavyq fleet` (docs/fleet.md): machines heavyq only watches, and other queues it observes read-only.
# [[remote]]
# name = "box3"
# ssh = "box3"
# observe_only = true      # probed for load, RAM and processes; never a run target
#
# [[foreign]]
# name = "bashq"
# history = "/var/tmp/bashq/history.tsv"   # TSV, one finished run per line
# format = "tsv"                          # the default, and the one layout supported
# columns = ["end_epoch", "machine", "lane", "prio", "light", "wait_s", "run_s", "exit"]   # the default
# tickets = "/var/tmp/bashq"               # <prio>-<20-digit ns>-<pid>-<lane>, ".run" while running
# infra_exits = [97, 124]                  # this queue's own infrastructure exits (127, 137, 255 always are)
# machines_dir = "/srv/ops/machines.d"     # <machine>.env with SLOTS, LIGHT_SLOTS, KIND
# slot_dirs = { box3 = ".bashq/slots" }    # its slot lock files on each machine
# aliases = { "build-1" = "local" }        # names the queue writes -> heavyq machine names
