#:schema https://raw.githubusercontent.com/LysCongThanh/heavyq/main/schema/heavyq.schema.json
# What "proven" means for heavyq itself. `heavyq gate status` says whether the
# code checked out now has passed all of it; `heavyq gate run` runs what has not.
# CI runs the same gate with the freshly built binary, so a local proof and a CI
# proof mean the same thing. See docs/gates.md.
[[gate]]
name = "ready"
run  = [
  "gofmt -l . | (! grep .)",
  "go vet ./...",
  "go test -race -timeout 20m -count=1 ./...",  # the cli end-to-end rigs run in parallel (about 70 s of the package under -race on a 12-core remote, was ~11 min); the longer timeout is headroom for small CI runners
]
prio = 3

# The gate of the fast CI tier (every pull request, `heavyq gate run fast`): the same commands without the race
# detector, and the end-to-end tests drive a heavyq binary built without it (HEAVYQ_TEST_NORACE=1), which takes
# the suite from about 9 minutes to under 3. The two latency budgets are timing tests that only mean something on
# a quiet machine: CI runs them alone in an earlier step, so the parallel packages here skip them. `ready` stays
# the full proof; CI runs it on main and nightly.
[[gate]]
name = "fast"
run  = [
  "gofmt -l . | (! grep .)",
  "go vet ./...",
  "env HEAVYQ_TEST_NORACE=1 go test -count=1 -skip 'Latency|HookPathUnder20ms' ./...",
]
prio = 3

# The proofs of the anchor items (.heavyq/anchor.md, `proof: gate:<name>`), one gate per item, named like it.
# An agent proves an item with `heavyq item done <id> --run --remote linuxi` or `heavyq gate run <id> --remote linuxi`:
# no `sh -c '...'` to type, which agent harnesses that vet commands refuse (#123). `go test -run` that matches
# no test exits 0, so each proof also greps for the test's own PASS line: the test must exist and pass.
[[gate]]
name = "proof-scope"
run  = ["go test -count=1 -run '^TestE2EDocsCommitKeepsScopedProof$' -v ./internal/cli | grep -q -- '--- PASS: TestE2EDocsCommitKeepsScopedProof'"]

[[gate]]
name = "recap-accuracy"
run  = ["go test -count=1 -run '^TestE2ERecapCountsEveryProof$' -v ./internal/cli | grep -q -- '--- PASS: TestE2ERecapCountsEveryProof'"]

[[gate]]
name = "next-claim"
run  = ["go test -count=1 -run '^TestE2EItemNextRefusesPathOverlap$' -v ./internal/cli | grep -q -- '--- PASS: TestE2EItemNextRefusesPathOverlap'"]

[[gate]]
name = "tick-free-done"
run  = ["go test -count=1 -run '^TestE2EItemDoneFromWorktreeLeavesAnchor$' -v ./internal/cli | grep -q -- '--- PASS: TestE2EItemDoneFromWorktreeLeavesAnchor'"]

[[gate]]
name = "stance-hygiene"
run  = ["go test -count=1 -run '^TestStanceDirIgnoresNonStanceFiles$' -v ./internal/stance | grep -q -- '--- PASS: TestStanceDirIgnoresNonStanceFiles'"]
