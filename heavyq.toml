#:schema https://raw.githubusercontent.com/LysCongThanh/heavyq/main/schema/heavyq.schema.json
# What "proven" means for heavyq itself. `heavyq gate status` says whether the
# code checked out now has passed all of it; `heavyq gate run` runs what has not.
# CI runs the same gate with the freshly built binary, so a local proof and a CI
# proof mean the same thing. See docs/gates.md.
[[gate]]
name = "ready"
run  = [
  "gofmt -l . | (! grep .)",
  "go vet ./...",
  "go test -race -timeout 20m -count=1 ./...",  # the cli end-to-end suite alone runs ~9 minutes under the race detector: the default 10m is a coin flip
]
prio = 3

# The gate of the fast CI tier (every pull request, `heavyq gate run fast`): the same commands without the race
# detector, and the end-to-end tests drive a heavyq binary built without it (HEAVYQ_TEST_NORACE=1), which takes
# the suite from about 9 minutes to under 3. The two latency budgets are timing tests that only mean something on
# a quiet machine: CI runs them alone in an earlier step, so the parallel packages here skip them. `ready` stays
# the full proof; CI runs it on main and nightly.
[[gate]]
name = "fast"
run  = [
  "gofmt -l . | (! grep .)",
  "go vet ./...",
  "env HEAVYQ_TEST_NORACE=1 go test -count=1 -skip 'Latency|HookPathUnder20ms' ./...",
]
prio = 3
