# golangci-lint v2. Conservative on purpose: the default set plus two cheap, low-noise linters.
# (misspell is off: the project writes British English.)
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
  settings:
    errcheck:
      # Best-effort cleanup and terminal output: failures here are not actionable.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - os.Remove
        - os.RemoveAll
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    staticcheck:
      checks:
        - all
        - -QF* # quick-fix suggestions are style, not bugs
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022

formatters:
  enable:
    - gofmt
