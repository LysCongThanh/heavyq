<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>heavyq</title>
<style>
:root{
  --ink:#18181b;--ink-2:#52525b;--ink-3:#71717a;--ink-4:#a1a1aa;
  --line:#e4e4e7;--line-2:#f4f4f5;--line-3:#d4d4d8;--bg:#fff;--bg-2:#fafafa;
  --primary:#18181b;--on-primary:#fff;--link:#2e56a6;
  --st-run:#12a150;--st-wait:#e8a317;--st-info:#2e56a6;--st-off:#8a90a6;--st-none:#d4d4d8;--st-bad:#d9480f;
  --danger:#b42318;--danger-bg:#fef3f2;--danger-line:#fecdca;
  --warn-bg:#fff8eb;--warn-line:#fde3b5;--warn-fg:#92400e;
  --ok-bg:#f0faf4;--ok-line:#bfe6cf;--ok-fg:#067647;
  --out:#7c3aed;
  --c1:#2e56a6;--c2:#c2410c;--c3:#0f766e;--c4:#a16207;--c5:#7c3aed;--c6:#64748b;--c7:#be185d;--c8:#15803d;
  --sh-card:0 0 0 1px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --sh-menu:0 0 0 1px rgba(0,0,0,.08),0 16px 40px -8px rgba(0,0,0,.22);
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r-btn:6px;--r-card:10px;--dur:160ms;--ease:cubic-bezier(.2,0,0,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --ink:#f4f4f5;--ink-2:#d4d4d8;--ink-3:#a1a1aa;--ink-4:#71717a;
  --line:#2e2e33;--line-2:#1f1f23;--line-3:#3f3f46;--bg:#111113;--bg-2:#18181b;
  --primary:#f4f4f5;--on-primary:#111113;--link:#7fa2e8;
  --st-run:#3dd68c;--st-wait:#f6c86a;--st-info:#7fa2e8;--st-off:#a1aec0;--st-none:#3f3f46;--st-bad:#f97066;
  --danger:#f04438;--danger-bg:#2a1210;--danger-line:#7a271a;
  --warn-bg:#2b2110;--warn-line:#5c4515;--warn-fg:#f6c86a;
  --ok-bg:#0f2a1b;--ok-line:#1f5c3a;--ok-fg:#7ee2a8;
  --out:#b794f4;
  --c1:#7fa2e8;--c2:#f6a06a;--c3:#4fd1c5;--c4:#f6c86a;--c5:#b794f4;--c6:#a1aec0;--c7:#f472b6;--c8:#4ade80;
  --sh-card:0 0 0 1px rgba(255,255,255,.08),0 1px 2px rgba(0,0,0,.4);
  --sh-menu:0 0 0 1px rgba(255,255,255,.1),0 16px 40px -8px rgba(0,0,0,.7);
}}
:root[data-theme=dark]{
  --ink:#f4f4f5;--ink-2:#d4d4d8;--ink-3:#a1a1aa;--ink-4:#71717a;
  --line:#2e2e33;--line-2:#1f1f23;--line-3:#3f3f46;--bg:#111113;--bg-2:#18181b;
  --primary:#f4f4f5;--on-primary:#111113;--link:#7fa2e8;
  --st-run:#3dd68c;--st-wait:#f6c86a;--st-info:#7fa2e8;--st-off:#a1aec0;--st-none:#3f3f46;--st-bad:#f97066;
  --danger:#f04438;--danger-bg:#2a1210;--danger-line:#7a271a;
  --warn-bg:#2b2110;--warn-line:#5c4515;--warn-fg:#f6c86a;
  --ok-bg:#0f2a1b;--ok-line:#1f5c3a;--ok-fg:#7ee2a8;
  --out:#b794f4;
  --c1:#7fa2e8;--c2:#f6a06a;--c3:#4fd1c5;--c4:#f6c86a;--c5:#b794f4;--c6:#a1aec0;--c7:#f472b6;--c8:#4ade80;
  --sh-card:0 0 0 1px rgba(255,255,255,.08),0 1px 2px rgba(0,0,0,.4);
  --sh-menu:0 0 0 1px rgba(255,255,255,.1),0 16px 40px -8px rgba(0,0,0,.7);
}
@media (prefers-reduced-motion:reduce){:root{--dur:0ms}*{animation:none!important}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 13px/20px var(--font);-webkit-font-smoothing:antialiased}
b,strong{font-weight:500}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.label{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
*::-webkit-scrollbar{width:10px;height:10px}*::-webkit-scrollbar-thumb{background:color-mix(in oklab,var(--ink-4) 40%,transparent);border:2px solid transparent;background-clip:padding-box;border-radius:6px}*::-webkit-scrollbar-track{background:transparent}

/* top */
.top{position:sticky;top:0;z-index:5;height:49px;border-bottom:1px solid var(--line);background:color-mix(in oklab,var(--bg) 90%,transparent);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:0 16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px}
.mark{width:22px;height:22px;border-radius:6px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font:500 11px/1 var(--mono)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2);white-space:nowrap}
.chip.warn{background:var(--warn-bg);box-shadow:inset 0 0 0 1px var(--warn-line);color:var(--warn-fg)}
.chip.ok{background:var(--ok-bg);box-shadow:inset 0 0 0 1px var(--ok-line);color:var(--ok-fg)}
.chip.bad{background:var(--danger-bg);box-shadow:inset 0 0 0 1px var(--danger-line);color:var(--danger)}
.spacer{flex:1}
.iconbtn{width:32px;height:32px;border:0;background:transparent;border-radius:var(--r-btn);display:grid;place-items:center;color:var(--ink-2);cursor:pointer}
.iconbtn:hover{background:var(--line-2)}
.dot{display:inline-block;width:7px;height:7px;border-radius:2px;flex:none;background:var(--st-none)}
.live .dot{border-radius:999px;background:currentColor}
.live.on .dot{animation:pulse 2s var(--ease) infinite}
@keyframes pulse{50%{opacity:.3}}
@media (max-width:600px){.hide-sm{display:none}}

main{max-width:1320px;margin:0 auto;padding:28px 16px 64px;container-type:inline-size}
@media (min-width:768px){main{padding:40px 40px 80px}}

/* story */
.story{max-width:860px}
.story h1{margin:0;font:400 26px/36px var(--font);letter-spacing:-.022em;color:var(--ink-3);text-wrap:pretty}
.story h1 em{font-style:normal;color:var(--ink)}
.story h1 .k{font-variant-numeric:tabular-nums}
.story h1 .hot{color:var(--danger)}
.story h1 .lane-n{color:var(--ink);white-space:nowrap}
.story h1 .lane-n i{display:inline-block;width:9px;height:9px;border-radius:999px;margin:0 6px 2px 2px;vertical-align:middle}
@container (max-width:600px){.story h1{font-size:21px;line-height:30px}}
.sub{margin-top:12px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:6px 16px}
.sub span{white-space:nowrap}
.sub b{color:var(--ink-2)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}

/* tower: what needs the human; one calm line when nothing does */
.tower{max-width:860px;margin-bottom:36px}
.calm{margin:0;font:400 15px/22px var(--font);color:var(--ink-2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.calm .dot{width:8px;height:8px;border-radius:999px;background:var(--st-run)}
.calm b{color:var(--ink);font-weight:500}
.calm .snooze{color:var(--ink-3);font-size:12.5px}
.calm .snooze button,.tfoot button{border:0;background:none;padding:0;color:var(--link);cursor:pointer;font:inherit;text-decoration:underline}
.tcards{display:grid;gap:10px;margin-top:10px}
.tcard{display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:2px 12px;padding:12px 12px 12px 14px;border-radius:var(--r-card);box-shadow:var(--sh-card);background:var(--bg)}
.tcard>i{width:9px;height:9px;border-radius:999px;margin-top:6px;background:var(--st-wait)}
.tcard.critical>i{background:var(--st-bad)}
.tcard.critical{background:linear-gradient(90deg,var(--danger-bg),var(--bg) 40%)}
.tcard p{margin:0;font-size:14px;line-height:21px;color:var(--ink);text-wrap:pretty}
.tcard .ev{grid-column:2;display:flex;flex-wrap:wrap;gap:0 14px;color:var(--ink-3);font-size:12px;min-width:0}
.tcard .ev .mono{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard .ta{grid-column:2;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.tcard .x{grid-column:3;grid-row:1}
.tcard code{font:12px/18px var(--mono);padding:3px 8px;border-radius:var(--r-btn);background:var(--line-2);color:var(--ink-2);user-select:all;overflow-wrap:anywhere}
.tfoot{margin-top:12px;color:var(--ink-3);font-size:12.5px}

/* buttons */
.btn{height:30px;padding:0 12px;border-radius:var(--r-btn);border:0;cursor:pointer;font-size:12.5px;white-space:nowrap;background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-3);transition:background var(--dur) var(--ease)}
.btn:hover{background:var(--line-2)}
.btn.pri{background:var(--primary);color:var(--on-primary);box-shadow:none}
.btn.pri:hover{opacity:.88}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.btn.dan{color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger-line)}
.btn.dan:hover{background:var(--danger-bg)}
.btn.dan.solid{background:var(--danger);color:#fff;box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}
.step{display:inline-flex;align-items:center;border-radius:var(--r-btn);box-shadow:inset 0 0 0 1px var(--line-3);height:24px}
.step button{border:0;background:transparent;width:22px;height:24px;cursor:pointer;color:var(--ink-2);border-radius:var(--r-btn)}
.step button:hover:not(:disabled){background:var(--line-2)}
.step button:disabled{opacity:.35;cursor:default}
.step span{min-width:20px;text-align:center;font:500 11.5px var(--mono)}

/* section header */
.sec{display:flex;align-items:center;gap:12px;margin:44px 0 12px;flex-wrap:wrap}
.sec h2{margin:0;font:500 15px/22px var(--font)}
.sec .spacer{flex:1}
.seg{display:inline-flex;padding:2px;border-radius:8px;background:var(--line-2);gap:2px}
.seg button{border:0;background:transparent;height:24px;padding:0 9px;border-radius:6px;cursor:pointer;color:var(--ink-3);font-size:12px}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--ink);box-shadow:var(--sh-card)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{display:inline-block;width:18px;height:8px;border-radius:2px;background:var(--ink-3)}
.sw.wait{background:repeating-linear-gradient(135deg,var(--ink-3) 0 1.5px,transparent 1.5px 4px);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--ink-3) 45%,transparent)}

/* flow */
.flow{border-radius:var(--r-card);box-shadow:var(--sh-card);background:var(--bg);overflow:hidden}
.frow{display:grid;grid-template-columns:168px minmax(0,1fr) 300px;align-items:center;gap:0 16px;padding:0 16px;min-height:44px;border-top:1px solid var(--line-2)}
.frow:first-child{border-top:0}
.frow.idle .who{color:var(--ink-3)}
.frow.active{background:linear-gradient(90deg,transparent,color-mix(in oklab,var(--line-2) 60%,transparent))}
@container (max-width:860px){.frow{grid-template-columns:120px minmax(0,1fr);padding:8px 12px}.frow .st{grid-column:1/-1;padding:4px 0 2px}}
.who{display:flex;align-items:center;gap:8px;min-width:0;font-weight:500}
.who i{width:9px;height:9px;border-radius:999px;flex:none}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:28px}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line-2)}
.seg-w,.seg-r{position:absolute;top:8px;height:12px;border-radius:3px;min-width:2px}
.seg-w{background:repeating-linear-gradient(135deg,var(--c) 0 1.5px,transparent 1.5px 4.5px);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--c) 45%,transparent);opacity:.9}
.seg-r{background:var(--c)}
.seg-r.remote{background:color-mix(in oklab,var(--c) 35%,transparent);box-shadow:inset 0 0 0 1.5px var(--c)}
.seg-r.fail{box-shadow:inset -3px 0 0 var(--st-bad)}
.seg-w.live{animation:breathe 2.4s var(--ease) infinite}
@keyframes breathe{50%{opacity:.45}}
.mk{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:999px;display:grid;place-items:center;font:600 9.5px/1 var(--font);color:#fff;box-shadow:0 0 0 2px var(--bg)}
.mk.cache{background:var(--st-run)}.mk.gave{background:var(--st-bad)}.mk.cancel{background:var(--st-off)}.mk.forced{background:var(--st-wait);color:#1a1a1a}
.legend .mk{position:static;margin:0;box-shadow:none}
.now{position:absolute;top:-6px;bottom:-6px;right:0;width:0;border-right:1.5px solid var(--ink)}
.st{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px;min-width:0}
.st .txt{min-width:0;flex:1;line-height:17px}
.st .txt b{color:var(--ink)}
.st .txt>:first-child,.st .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .txt small{display:block;color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .why{color:var(--warn-fg)}
.axis{display:grid;grid-template-columns:168px minmax(0,1fr) 300px;gap:0 16px;padding:8px 16px 10px;border-top:1px solid var(--line)}
@container (max-width:860px){.axis{grid-template-columns:120px minmax(0,1fr);padding:8px 12px}}
.axis .ticks{position:relative;height:14px;font:400 10.5px/14px var(--mono);color:var(--ink-4)}
.axis .ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.axis .ticks span.nowl{transform:translateX(-100%);color:var(--ink)}
.more{padding:10px 16px;color:var(--ink-3);font-size:12.5px;border-top:1px solid var(--line-2)}
.empty{padding:36px 16px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:2px}
.confirm{display:inline-flex;gap:6px;align-items:center}

/* capacity */
.caps{display:grid;gap:10px}
.cap{display:grid;grid-template-columns:168px minmax(0,1fr) 300px;gap:0 16px;align-items:center;padding:12px 16px;border-radius:var(--r-card);box-shadow:var(--sh-card)}
@container (max-width:860px){.cap{grid-template-columns:1fr;gap:8px;padding:12px}}
.cap .name{display:flex;align-items:center;gap:8px;font-weight:500}
.cap .name .tag{margin:0}
.bar{position:relative;height:14px;border-radius:4px;background:var(--line-2);display:flex}
.bar>span{height:100%;flex:none}
.bar>span:first-child{border-radius:4px 0 0 4px}
.bar .o{background:color-mix(in oklab,var(--out) 70%,transparent)}
.bar .u{background:var(--ink-4);opacity:.55}
.bar .rv{background:repeating-linear-gradient(135deg,var(--st-wait) 0 2px,transparent 2px 5px)}
.bar .need{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.cap .meta{font-size:12.5px;color:var(--ink-3);line-height:18px}
.cap .meta b{color:var(--ink)}
.pools{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pools .chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.slots{display:inline-flex;gap:3px;vertical-align:-1px;margin-left:2px}
.slots i{width:9px;height:9px;border-radius:2px;box-shadow:inset 0 0 0 1px var(--line-3)}
.slots i.outside{background:color-mix(in oklab,var(--out) 70%,transparent);box-shadow:none}
.cap.down{opacity:.75}
.cap.down .bar{background:repeating-linear-gradient(135deg,var(--line-2) 0 4px,transparent 4px 8px)}

/* history */
details.hist{margin-top:44px;border-radius:var(--r-card);box-shadow:var(--sh-card)}
details.hist summary{cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center;list-style:none}
details.hist summary::-webkit-details-marker{display:none}
details.hist summary h2{margin:0;font:500 15px/22px var(--font)}
details.hist summary .chev{transition:transform var(--dur) var(--ease);color:var(--ink-3)}
details.hist[open] summary .chev{transform:rotate(90deg)}
.filter{height:28px;border-radius:var(--r-btn);border:0;box-shadow:inset 0 0 0 1px var(--line-3);background:var(--bg);padding:0 8px;font-size:12.5px;max-width:180px}
.scroll{overflow:auto;max-height:480px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font:400 10.5px/16px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:8px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg-2);white-space:nowrap;position:sticky;top:0}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right;white-space:nowrap}
.tbl td:first-child,.tbl th:first-child{padding-left:16px}.tbl td:last-child,.tbl th:last-child{padding-right:16px}
.cmd{font-family:var(--mono);font-size:12px;color:var(--ink-2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd:focus,.cmd:hover{white-space:normal;word-break:break-all}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;font:400 10.5px/1 var(--mono);background:var(--line-2);color:var(--ink-2);margin-right:4px;white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn-fg)}.tag.bad{background:var(--danger-bg);color:var(--danger)}.tag.ok{background:var(--ok-bg);color:var(--ok-fg)}

.stale main{opacity:.55;transition:opacity 300ms}
.gate{max-width:460px;margin:14vh auto;padding:32px;text-align:center;border-radius:var(--r-card);box-shadow:var(--sh-card)}
.gate h1{font:500 20px/28px var(--font);margin:14px 0 6px}
.gate p{color:var(--ink-3);margin:0}
.gate code{font-family:var(--mono);font-size:12px;background:var(--line-2);padding:2px 6px;border-radius:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#18181b;color:#fafafa;padding:10px 16px;border-radius:8px;box-shadow:var(--sh-menu);font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.toast.bad{background:var(--danger);color:#fff}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true">hq</span>heavyq</div>
  <span class="chip hide-sm" id="hostchip" hidden><span class="mono" id="host"></span></span>
  <span class="chip" id="modechip" hidden></span>
  <div class="spacer"></div>
  <span class="chip live" id="live"><span class="dot"></span><span id="livetxt">connecting</span></span>
  <button class="iconbtn" id="theme" aria-label="Toggle theme" title="Toggle theme">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor" stroke="none"/></svg>
  </button>
</header>
<div id="app"></div>
<script>
"use strict";
/* ───────── helpers ───────── */
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const sess={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};
function dur(s){s=Math.max(0,Math.round(s));if(s<60)return s+"s";if(s<3600){const m=Math.floor(s/60),r=s%60;return m+"m"+(r?" "+String(r).padStart(2,"0")+"s":"")}const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h+"h "+String(m).padStart(2,"0")+"m"}
function ago(ms){return dur((Date.now()-ms)/1000)+" ago"}
function mb(v){v=Math.max(0,v||0);return v>=1024?(v/1024).toFixed(v>=10240?0:1)+" GB":Math.round(v)+" MB"}
function cores(p){const c=p/100;return (c>=10?c.toFixed(0):c.toFixed(1))+(Math.abs(c-1)<.05?" core":" cores")}
const PAL=["--c1","--c2","--c3","--c4","--c5","--c6","--c7","--c8"];
function laneColor(l){let h=2166136261;for(const ch of String(l)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0}return `var(${PAL[h%PAL.length]})`}
const plural=(n,w)=>n+" "+(n===1?w:w+"s");
const hm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};

/* ───────── state ───────── */
const WINS={"30m":1800,"1h":3600,"6h":21600,"24h":86400};
const INS={"30m":"1h","1h":"1h","6h":"6h","24h":"24h"};
const S={token:null,demo:false,meta:null,snap:null,at:0,ins:null,hist:[],win:WINS[store.get("hq.flow")]?store.get("hq.flow"):"30m",laneFilter:"",confirm:null,live:false,histOpen:false};
const app=$("#app");

(function(){const t=store.get("hq.theme");if(t)document.documentElement.dataset.theme=t;
 $("#theme").onclick=()=>{const cur=document.documentElement.dataset.theme;const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches;const n=dark?"light":"dark";document.documentElement.dataset.theme=n;store.set("hq.theme",n)}})();
(function(){const h=location.hash;const m=h.match(/token=([0-9a-f]+)/);
 if(m){S.token=m[1];sess.set("hq.token",S.token);history.replaceState(null,"",location.pathname)}
 else if(h==="#demo")S.demo=true;else S.token=sess.get("hq.token")})();

/* ───────── API ───────── */
async function api(path,opt={}){const r=await fetch("/api/v1/"+path,{...opt,headers:{"Authorization":"Bearer "+S.token,"Content-Type":"application/json"}});
 if(r.status===401){gate("Token rejected","The dashboard was restarted. Open the new link printed by <code>heavyq dash</code>.");throw new Error("401")}return r}
let toastT;function toast(msg,bad){let t=$(".toast");if(!t){t=document.createElement("div");t.setAttribute("role","status");document.body.appendChild(t)}t.className="toast"+(bad?" bad":"");t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),3500)}
async function act(path,body,ok){if(S.demo){demoAct(path,body);toast(ok);return}
 try{const r=await api(path,{method:"POST",body:JSON.stringify(body||{})});if(r.ok){toast(ok);return}const e=await r.json().catch(()=>({}));toast(e.error||("Request failed ("+r.status+")"),true)}catch(e){if(e.message!=="401")toast("Network error",true)}}
async function stream(){for(let delay=1000;;delay=Math.min(delay*2,10000)){
  try{const r=await api("stream");const rd=r.body.getReader(),dec=new TextDecoder();let buf="";setLive(true);delay=1000;
   for(;;){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf("\n\n"))>=0){const ev=buf.slice(0,i);buf=buf.slice(i+2);let name="message",data="";
     for(const l of ev.split("\n")){if(l.startsWith("event: "))name=l.slice(7);else if(l.startsWith("data: "))data+=l.slice(6)}
     if(name==="snapshot"&&data){try{onSnap(JSON.parse(data))}catch(e){}}}}}catch(e){if(e.message==="401")return}
  setLive(false);await new Promise(r=>setTimeout(r,delay))}}
async function loadInsights(){if(S.demo)return;try{const r=await api("insights?window="+INS[S.win]);if(r.ok){S.ins=await r.json();render()}}catch(e){}}
async function loadHistory(){if(S.demo)return;try{const r=await api("history?n=1000");if(r.ok){S.hist=(await r.json()).records;render()}}catch(e){}}
function onSnap(s){S.snap=s;S.at=Date.now();render()}
function setLive(on){S.live=on;document.body.classList.toggle("stale",!on&&!!S.snap);renderLive()}
function renderLive(){const el=$("#live"),age=S.at?(Date.now()-S.at)/1000:0;
 el.className="chip live"+(S.demo?" warn":S.live?" on ok":S.snap?" bad":"");
 $("#livetxt").textContent=S.demo?"demo data":S.live?"live":S.snap?`disconnected · ${dur(age)} old`:"connecting"}
const canAct=()=>S.demo||(S.meta&&S.meta.control);
const el=()=>S.at?(Date.now()-S.at)/1000:0;

/* ───────── reasons ───────── */
function ramShort(r){const m=r.match(/^RAM (\d+) MB(?: \(minus (\d+) MB held[^)]*\))? < (\d+) MB needed/);if(!m)return null;return Math.max(0,+m[3]-(+m[1]-(+(m[2]||0))))}
function shortWhy(r){if(r==="")return "starts on the next poll";const s=ramShort(r);if(s!==null)return mb(s)+" short on RAM";
 if(/^waiting for /.test(r))return r.slice(12);if(/slots busy/.test(r))return "slots busy";if(/^load/.test(r))return "load over limit";if(/unreachable/.test(r))return "unreachable";if(/paused/.test(r))return "paused";
 const b=r.match(/^behind (.*)$/);if(b)return "behind "+b[1].replace(/ \(p\d\)/g,"");return r}
function causeOf(m,r){if(/^waiting for /.test(r))return `pool <em>${esc(r.slice(12))}</em>`;const s=ramShort(r);if(s!==null)return `<em>${esc(m)}</em> is <em class="k">${mb(s)}</em> short on RAM`;
 if(/slots busy/.test(r))return `every heavy slot on <em>${esc(m)}</em> is taken`;
 if(/^load/.test(r))return `<em>${esc(m)}</em> is over its load limit`;
 if(/unreachable/.test(r))return `<em>${esc(m)}</em> is unreachable`;
 if(/paused/.test(r))return `<em>${esc(m)}</em> is paused`;return esc(m+": "+r)}
const laneN=l=>`<span class="lane-n"><i style="background:${laneColor(l)}"></i>${esc(l)}</span>`;

/* ───────── tower: facts heavyq measured that need a human (snapshot.exceptions, computed in Go) ───────── */
const SNOOZE_MS=600000,KIND={red_gate:"red gate",loop:"loop",starved:"starved",machine:"machine"};
function snoozed(){try{const d=JSON.parse(store.get("hq.snooze")||"{}"),n=Date.now();for(const k in d)if(n-d[k]>=SNOOZE_MS)delete d[k];return d}catch(e){return {}}}
const snooze=(id,on)=>{const d=snoozed();if(on)d[id]=Date.now();else if(id)delete d[id];else for(const k in d)delete d[k];store.set("hq.snooze",JSON.stringify(d))};
function towerAction(e){const a=e.action;if(!a)return "";const cmd=`<code title="Run this in a terminal">${esc(a.command)}</code><button class="btn sm" data-act="copy" data-cmd="${esc(a.command)}">Copy</button>`;
 if(!canAct()||a.kind==="run")return cmd;
 if(a.kind==="cancel")return S.confirm===a.target?`<span class="confirm"><button class="btn sm dan solid" data-act="cancel" data-id="${esc(a.target)}" id="cf-yes">Cancel job</button><button class="btn sm" data-act="noconfirm">Keep</button></span>`:`<button class="btn sm dan" data-act="confirm" data-id="${esc(a.target)}">Cancel job</button>`;
 if(a.kind==="raise")return `<button class="btn sm pri" data-act="prio" data-id="${esc(a.target)}" data-v="${a.value}">Raise to p${a.value}</button>`;
 if(a.kind==="resume")return `<button class="btn sm pri" data-act="resume" data-m="${esc(a.target)}">Resume ${esc(a.target)}</button>`;return cmd}
function towerCard(e){const v=e.evidence||{},ev=[];
 if(v.at&&Date.parse(v.at)>0)ev.push(`<span>${ago(Date.parse(v.at))}</span>`);
 if(e.lane)ev.push(laneN(e.lane));if(e.machine)ev.push(`<span class="mono">${esc(e.machine)}</span>`);
 if(v.tree)ev.push(`<span class="mono" title="${esc(v.tree)}">tree ${esc(v.tree.slice(0,8))}</span>`);
 if(v.cmd){const c=v.cmd.replace(/^sh -c /,"");ev.push(`<span class="mono" title="${esc(c)}">${esc(c)}</span>`)}
 if(v.count>1)ev.push(`<span>${v.count}×</span>`);if(v.detail)ev.push(`<span>${esc(v.detail)}</span>`);
 const act=towerAction(e);
 return `<article class="tcard ${esc(e.severity)}" aria-label="${esc(KIND[e.kind]||e.kind)}"><i></i><p><span class="label" style="margin-right:8px">${esc(KIND[e.kind]||e.kind)}</span>${esc(e.text).replace(/`([^`]+)`/g,'<span class="mono">$1</span>')}</p>
 <button class="iconbtn x" data-act="snooze" data-id="${esc(e.id)}" aria-label="Dismiss for 10 minutes" title="Dismiss for 10 minutes">✕</button>
 <div class="ev">${ev.join("")}</div>${act?`<div class="ta">${act}</div>`:""}</article>`}
function tower(s){const all=Array.isArray(s.exceptions)?s.exceptions:[],sn=snoozed(),shown=all.filter(e=>!sn[e.id]),hidden=all.length-shown.length;
 const lanes=new Set(s.running.map(t=>t.lane)).size,un=(s.gates||[]).filter(g=>g.state==="unproven"),unt=un.length?` title="${esc(un.map(g=>g.lane).join(", "))}"`:"";
 const counts=`${plural(lanes,"lane")} working${Array.isArray(s.gates)?`, <span${unt}>${un.length} unproven</span>`:""}.`;
 const hid=hidden?`<span class="snooze">${hidden} dismissed · <button data-act="unsnooze">show</button></span>`:"";
 if(!shown.length)return `<section class="tower" aria-label="Needs you"><p class="calm"><span class="dot"></span><span><b>Nothing needs you.</b> ${counts}</span>${hid}</p></section>`;
 return `<section class="tower" aria-label="Needs you"><div class="label">Needs you · ${shown.length}</div><div class="tcards">${shown.map(towerCard).join("")}</div>
 <div class="tfoot">${counts} Unproven is a count, not an alarm. ${hid}</div></section>`}

/* ───────── story: the state of the queue as sentences ───────── */
/* snapshot.story is built in Go (the same sentences as `heavyq why`): sentences of spans. storyFallback below is the
   same logic in JS, kept for servers that predate the field and for the demo data. */
function spanHtml(p){const t=esc(p.text);if(p.lane)return laneN(p.lane);if(p.hot)return `<span class="hot">${t}</span>`;
 if(p.em)return `<em${p.num?' class="k"':""}>${t}</em>`;return t}
const goStory=s=>Array.isArray(s.story)&&s.story.length?s.story.map(x=>x.parts&&x.parts.length?x.parts.map(spanHtml).join(""):esc(x.text)):null;
function storyFallback(s,e){const W=s.waiting.length,R=s.running.length,parts=[],head=s.waiting[0];
 if(!W&&!R)parts.push(`<em>All quiet.</em> Nothing runs, nothing waits.`);
 else if(!W)parts.push(`<em>${plural(R,"job")}</em> running and <em>nobody waits</em>.`);
 else{const rs=Object.entries(head.reasons);
  if(rs.some(([,r])=>r===""))parts.push(`<em>${plural(W,"agent")} ${W===1?"waits":"wait"}</em>, and ${laneN(head.lane)} starts on the next poll.`);
  else{const causes=rs.filter(([,r])=>!/^behind/.test(r)).slice(0,2).map(([m,r])=>causeOf(m,r));
   parts.push(`<em>${plural(W,"agent")} ${W===1?"waits":"wait"}</em> because ${causes.join(" and ")||"the queue ahead is full"}.`)}}
 const c=s.cpu,lm=s.machines.find(m=>m.name==="local");
 if(c&&c.available&&lm&&lm.total_mb){const ot=c.outside_total,top=c.outside[0];
  if(ot.rss_mb/lm.total_mb>.3&&top)parts.push(`Outside the queue, <em>${top.procs} ${esc(top.name)} process${top.procs===1?"":"es"}</em> hold <em class="k">${mb(top.rss_mb)}</em>${c.outside.length>1?`, everything else <em class="k">${mb(ot.rss_mb-top.rss_mb)}</em>`:""}.`)}
 if(head&&head.bypass_in_s>=0&&s.config.resource_gate&&Object.values(head.reasons).every(r=>r!==""))
  {const left=head.bypass_in_s-e;parts.push(left>0?`${laneN(head.lane)} skips the RAM and load checks in <em class="k">${dur(left)}</em>.`:`${laneN(head.lane)} now skips the RAM and load checks.`)}
 const forced=s.running.filter(t=>t.forced);if(forced.length)parts.push(`${forced.map(t=>laneN(t.lane)).join(", ")} got in through that bypass.`);
 const down=s.machines.filter(m=>!m.reachable);if(down.length)parts.push(`<span class="hot">${down.map(m=>esc(m.name)).join(", ")} ${down.length>1?"are":"is"} unreachable.</span>`);
 return parts}
function story(s){const W=s.waiting.length,R=s.running.length,head=s.waiting[0],parts=goStory(s)||storyFallback(s,el());
 const i=S.ins,local=s.running.filter(t=>t.machine==="local").length,rem=R-local;
 const sub=[R?`<span><b>${R}</b> running${rem?` · ${local} local, ${rem} remote`:""}</span>`:"",W?`<span><b>${W}</b> waiting</span>`:"",
  i?`<span>last ${INS[S.win]}: <b>${i.runs}</b> runs · wait p95 <b>${dur(i.wait_p95_s)}</b> · <b>${i.gave_up}</b> gave up · <b>${i.cache_hits+i.coalesced}</b> didn't need to run</span>`:""].filter(Boolean).join("");
 const acts=[];
 if(canAct()){if(head&&head.prio>1&&Object.values(head.reasons).every(r=>r!==""))acts.push(`<button class="btn pri" data-act="prio" data-id="${esc(head.id)}" data-v="${head.prio-1}">Raise ${esc(head.lane)} to p${head.prio-1}</button>`);
  for(const m of s.machines)if(m.paused)acts.push(`<button class="btn" data-act="resume" data-m="${esc(m.name)}">Resume ${esc(m.name)}</button>`)}
 return `<section class="story"><h1>${parts.join(" ")}</h1><div class="sub">${sub}</div>${acts.length?`<div class="acts">${acts.join("")}</div>`:""}</section>`}

/* ───────── flow: one row per lane (agent), wait hatched, run solid ───────── */
function lanesModel(s){const now=Date.now(),t0=now-WINS[S.win]*1000,L=new Map();
 const get=l=>{if(!L.has(l))L.set(l,{lane:l,segs:[],marks:[],last:0,state:null,lastRec:null});return L.get(l)};
 const clip=(a,b)=>[Math.max(a,t0),Math.min(b,now)];
 for(const r of S.hist){const end=Date.parse(r.end);if(!(end>=t0))continue;const run=(r.run_s||0)*1000,rs=end-run,enq=rs-(r.wait_s||0)*1000,x=get(r.lane);
  const hit=r.cache==="hit"||r.cache==="coalesced";
  const tip=`${r.cmd}\nwaited ${dur(r.wait_s)}${r.run_s&&!hit?" · ran "+dur(r.run_s):""}${r.machine?" · "+r.machine:""}${r.result?" · "+r.result.replace("_"," "):r.exit?" · exit "+r.exit:""}${r.forced?" · bypass":""}`;
  if(r.wait_s>.5){const [a,b]=clip(enq,rs);if(b>a)x.segs.push({k:"w",a,b,tip})}
  if(run>0&&!hit){const [a,b]=clip(rs,end);if(b>a)x.segs.push({k:"r",a,b,tip,remote:!!r.machine&&r.machine!=="local",fail:!r.result&&r.exit!==0})}
  if(hit)x.marks.push({k:"cache",t:end,g:"✓",tip:(r.cache==="hit"?"cache hit":"shared an identical run")+"\n"+r.cmd});
  if(r.result==="gave_up")x.marks.push({k:"gave",t:end,g:"✕",tip:"gave up\n"+tip});
  if(r.result==="cancelled")x.marks.push({k:"cancel",t:end,g:"–",tip:"cancelled\n"+tip});
  if(r.forced)x.marks.push({k:"forced",t:rs,g:"!",tip:"admitted by the anti-starvation bypass\n"+tip});
  if(end>=x.last){x.last=end;x.lastRec=r}}
 s.running.forEach((t,i)=>{const x=get(t.lane),claim=Date.parse(t.claimed_at),since=Date.parse(t.since),tip=`${t.cmd}\nrunning on ${t.machine}/${t.slot}`;
  if(claim-since>500){const [a,b]=clip(since,claim);if(b>a)x.segs.push({k:"w",a,b,tip})}
  const [a,b]=clip(claim,now);if(b>a)x.segs.push({k:"r",a,b,tip,remote:t.machine!=="local"});
  if(t.forced)x.marks.push({k:"forced",t:claim,g:"!",tip:"admitted by the anti-starvation bypass"});
  x.state={k:"run",t,order:i};x.last=now});
 s.waiting.forEach(t=>{const x=get(t.lane),[a,b]=clip(Date.parse(t.since),now);if(b>a)x.segs.push({k:"w",a,b,live:true,tip:`${t.cmd}\nwaiting #${t.position}`});
  if(!x.state)x.state={k:"wait",t,order:t.position};x.last=now});
 const arr=[...L.values()].filter(x=>x.state||x.segs.length||x.marks.length);
 const rank=x=>x.state?(x.state.k==="run"?0:1):2;
 arr.sort((a,b)=>rank(a)-rank(b)||(rank(a)<2?a.state.order-b.state.order:b.last-a.last));
 return {arr,t0,now}}

function cancelBtn(t){if(!canAct())return "";if(t.cancel_requested)return `<span class="tag warn">stopping…</span>`;
 if(S.confirm===t.id)return `<span class="confirm"><button class="btn sm dan solid" data-act="cancel" data-id="${esc(t.id)}" id="cf-yes">Cancel job</button><button class="btn sm" data-act="noconfirm">Keep</button></span>`;
 return `<button class="btn sm dan" data-act="confirm" data-id="${esc(t.id)}" aria-label="Cancel ${esc(t.lane)}" title="Cancel">✕</button>`}
function status(x){const e=el();
 if(x.state&&x.state.k==="run"){const t=x.state.t;return `<div class="st"><span class="dot" style="background:var(--st-run)"></span><div class="txt"><b>running ${dur(t.run_s+e)}</b> · <span class="mono">${esc(t.machine)}/${esc(t.slot)}</span><small title="${esc(t.cmd)}">${t.machine==="local"?cores(t.cpu_pct)+" · "+mb(t.rss_mb)+" · ":""}${esc(t.cmd)}</small></div>${cancelBtn(t)}</div>`}
 if(x.state&&x.state.k==="wait"){const t=x.state.t,rs=Object.values(t.reasons),why=rs.includes("")?"":rs[0]||"";
  const step=canAct()&&!t.cancel_requested?`<span class="step" role="group" aria-label="Priority of ${esc(t.lane)}"><button data-act="prio" data-id="${esc(t.id)}" data-v="${t.prio-1}" ${t.prio<=1?"disabled":""} aria-label="Raise priority">−</button><span>p${t.prio}</span><button data-act="prio" data-id="${esc(t.id)}" data-v="${t.prio+1}" ${t.prio>=9?"disabled":""} aria-label="Lower priority">+</button></span>`:`<span class="mono">p${t.prio}</span>`;
  return `<div class="st"><span class="dot" style="background:var(--st-wait)"></span><div class="txt"><b>#${t.position} waiting ${dur(t.wait_s+e)}</b><small class="why" title="${esc(Object.entries(t.reasons).map(([m,r])=>m+": "+(r||"starts on the next poll")).join("\n"))}">${esc(shortWhy(why))}</small></div>${step}${cancelBtn(t)}</div>`}
 const r=x.lastRec;if(!r)return `<div class="st"></div>`;
 const what=r.cache==="hit"?"cache hit":r.cache==="coalesced"?"shared a run":r.result==="gave_up"?"gave up":r.result==="cancelled"?"cancelled":r.result==="interrupted"?"interrupted":r.exit?"failed (exit "+r.exit+")":"passed";
 return `<div class="st"><span class="dot"></span><div class="txt">${esc(what)} ${ago(Date.parse(r.end))}<small title="${esc(r.cmd)}">${esc(r.cmd)}</small></div></div>`}
function flow(s){const {arr,t0,now}=lanesModel(s),span=now-t0,pc=t=>((t-t0)/span*100).toFixed(3)+"%",wd=(a,b)=>((b-a)/span*100).toFixed(3)+"%";
 const MAX=16,rows=arr.slice(0,MAX).map(x=>{const c=laneColor(x.lane);
  const segs=x.segs.map(g=>`<span class="${g.k==="w"?"seg-w":"seg-r"}${g.live?" live":""}${g.remote?" remote":""}${g.fail?" fail":""}" style="left:${pc(g.a)};width:${wd(g.a,g.b)}" title="${esc(g.tip)}"></span>`).join("");
  const marks=x.marks.filter(m=>m.t>=t0).map(m=>`<span class="mk ${m.k}" style="left:${pc(m.t)}" title="${esc(m.tip)}">${m.g}</span>`).join("");
  return `<div class="frow${x.state?" active":" idle"}" style="--c:${c}"><div class="who"><i style="background:${c}"></i><span title="${esc(x.lane)}">${esc(x.lane)}</span></div><div class="track">${segs}${marks}<span class="now"></span></div>${status(x)}</div>`}).join("");
 const step={"30m":300,"1h":600,"6h":3600,"24h":4*3600}[S.win]*1000;let ticks="";
 for(let t=Math.ceil(t0/step)*step;t<now-step*.4;t+=step)ticks+=`<span style="left:${pc(t)}">${hm(t)}</span>`;
 ticks+=`<span class="nowl" style="left:100%">now</span>`;
 return `<div class="sec"><h2>Agents</h2><span class="legend"><span><i class="sw wait"></i>waiting</span><span><i class="sw"></i>running</span><span><i class="mk cache">✓</i>didn't need to run</span><span><i class="mk gave">✕</i>gave up</span><span><i class="mk forced">!</i>bypass</span></span><span class="spacer"></span>
 <div class="seg" role="group" aria-label="Time window">${Object.keys(WINS).map(w=>`<button data-win="${w}" aria-pressed="${S.win===w}">${w}</button>`).join("")}</div></div>
 <div class="flow">${arr.length?rows+(arr.length>MAX?`<div class="more">+ ${arr.length-MAX} quieter lanes</div>`:"")+`<div class="axis"><span></span><div class="ticks">${ticks}</div></div>`:`<div class="empty"><b>No activity in the last ${S.win}</b>Heavy commands from your agents draw a line here, one row per lane.</div>`}</div>`}

/* ───────── capacity: what fills each machine, and the room a job needs ───────── */
function capacity(s){return `<div class="sec"><h2>Machines</h2><span class="legend"><span><i class="sw" style="background:color-mix(in oklab,var(--out) 70%,transparent)"></i>outside the queue</span><span><i class="sw" style="background:var(--c1)"></i>queued jobs</span><span><i class="sw" style="background:repeating-linear-gradient(135deg,var(--st-wait) 0 2px,transparent 2px 5px)"></i>held for jobs that just started</span><span><i class="sw" style="width:2px;background:var(--ink)"></i>a heavy job needs the room right of this</span></span></div>
 <div class="caps">${s.machines.map(m=>{
  const ctl=canAct()&&m.reachable?`<button class="btn sm" data-act="${m.paused?"resume":"pause"}" data-m="${esc(m.name)}">${m.paused?"Resume":"Pause"}</button>`:"";
  const slots=`<span class="slots" aria-label="slots">${m.slots.map(x=>`<i class="${x.state}" title="${esc(x.name)}: ${x.state==="held"?esc(x.lane):x.state==="outside"?"locked outside the queue":"free"}" ${x.state==="held"?`style="background:${laneColor(x.lane)};box-shadow:none"`:""}></i>`).join("")}</span>`;
  if(!m.reachable)return `<div class="cap down"><div class="name"><span class="dot" style="background:var(--st-bad)"></span>${esc(m.name)}</div><div class="bar"></div><div class="meta"><b>unreachable</b> · jobs that can only run here wait</div></div>`;
  let bar,meta;const need=m.job_mb+m.reserve_mb;
  if(m.metrics_known){const total=m.total_mb||Math.max(m.free_mb+m.reserved_mb+need,m.free_mb*1.3),used=Math.max(0,total-m.free_mb);
