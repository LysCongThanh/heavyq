<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>heavyq</title>
<style>
:root{
  --ink:#18181b;--ink-2:#52525b;--ink-3:#71717a;--ink-4:#a1a1aa;
  --line:#e4e4e7;--line-2:#f4f4f5;--line-3:#d4d4d8;--bg:#fff;--bg-2:#fafafa;
  --primary:#18181b;--on-primary:#fff;--link:#2e56a6;
  --st-run:#12a150;--st-wait:#e8a317;--st-info:#2e56a6;--st-off:#8a90a6;--st-none:#d4d4d8;--st-bad:#d9480f;
  --danger:#b42318;--danger-bg:#fef3f2;--danger-line:#fecdca;
  --warn-bg:#fff8eb;--warn-line:#fde3b5;--warn-fg:#92400e;
  --ok-bg:#f0faf4;--ok-line:#bfe6cf;--ok-fg:#067647;
  --out:#7c3aed;--hatch:#f4f4f5;
  --c1:#2e56a6;--c2:#c2410c;--c3:#0f766e;--c4:#a16207;--c5:#7c3aed;--c6:#64748b;
  --grid:#e4e4e7;--axis:#71717a;
  --sh-card:0 0 0 1px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --sh-menu:0 0 0 1px rgba(0,0,0,.08),0 16px 40px -8px rgba(0,0,0,.22);
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r-tag:4px;--r-btn:6px;--r-card:8px;--dur:120ms;--ease:cubic-bezier(.2,0,0,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --ink:#f4f4f5;--ink-2:#d4d4d8;--ink-3:#a1a1aa;--ink-4:#71717a;
  --line:#2e2e33;--line-2:#232327;--line-3:#3f3f46;--bg:#111113;--bg-2:#18181b;
  --primary:#f4f4f5;--on-primary:#111113;--link:#7fa2e8;
  --st-run:#3dd68c;--st-wait:#f6c86a;--st-info:#7fa2e8;--st-off:#a1aec0;--st-none:#3f3f46;--st-bad:#f97066;
  --danger:#f04438;--danger-bg:#2a1210;--danger-line:#7a271a;
  --warn-bg:#2b2110;--warn-line:#5c4515;--warn-fg:#f6c86a;
  --ok-bg:#0f2a1b;--ok-line:#1f5c3a;--ok-fg:#7ee2a8;
  --out:#b794f4;--hatch:#232327;
  --c1:#7fa2e8;--c2:#f6a06a;--c3:#4fd1c5;--c4:#f6c86a;--c5:#b794f4;--c6:#a1aec0;
  --grid:#2e2e33;--axis:#a1a1aa;
  --sh-card:0 0 0 1px rgba(255,255,255,.08),0 1px 2px rgba(0,0,0,.4);
  --sh-menu:0 0 0 1px rgba(255,255,255,.1),0 16px 40px -8px rgba(0,0,0,.7);
}}
:root[data-theme=dark]{
  --ink:#f4f4f5;--ink-2:#d4d4d8;--ink-3:#a1a1aa;--ink-4:#71717a;
  --line:#2e2e33;--line-2:#232327;--line-3:#3f3f46;--bg:#111113;--bg-2:#18181b;
  --primary:#f4f4f5;--on-primary:#111113;--link:#7fa2e8;
  --st-run:#3dd68c;--st-wait:#f6c86a;--st-info:#7fa2e8;--st-off:#a1aec0;--st-none:#3f3f46;--st-bad:#f97066;
  --danger:#f04438;--danger-bg:#2a1210;--danger-line:#7a271a;
  --warn-bg:#2b2110;--warn-line:#5c4515;--warn-fg:#f6c86a;
  --ok-bg:#0f2a1b;--ok-line:#1f5c3a;--ok-fg:#7ee2a8;
  --out:#b794f4;--hatch:#232327;
  --c1:#7fa2e8;--c2:#f6a06a;--c3:#4fd1c5;--c4:#f6c86a;--c5:#b794f4;--c6:#a1aec0;
  --grid:#2e2e33;--axis:#a1a1aa;
  --sh-card:0 0 0 1px rgba(255,255,255,.08),0 1px 2px rgba(0,0,0,.4);
  --sh-menu:0 0 0 1px rgba(255,255,255,.1),0 16px 40px -8px rgba(0,0,0,.7);
}
@media (prefers-reduced-motion:reduce){:root{--dur:0ms}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 13px/20px var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100vh}
b,strong{font-weight:500}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:1px}
.mono{font-family:var(--mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.mute{color:var(--ink-3)}.mute4{color:var(--ink-4)}
.label{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
*::-webkit-scrollbar{width:10px;height:10px}*::-webkit-scrollbar-thumb{background:color-mix(in oklab,var(--ink-4) 40%,transparent);border:2px solid transparent;background-clip:padding-box;border-radius:6px}*::-webkit-scrollbar-track{background:transparent}

/* top bar */
.top{position:sticky;top:0;z-index:5;height:49px;border-bottom:1px solid var(--line);background:color-mix(in oklab,var(--bg) 92%,transparent);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:0 16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px}
.mark{width:22px;height:22px;border-radius:6px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font:500 11px/1 var(--mono)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2);white-space:nowrap}
.chip.warn{background:var(--warn-bg);box-shadow:inset 0 0 0 1px var(--warn-line);color:var(--warn-fg)}
.chip.ok{background:var(--ok-bg);box-shadow:inset 0 0 0 1px var(--ok-line);color:var(--ok-fg)}
.chip.bad{background:var(--danger-bg);box-shadow:inset 0 0 0 1px var(--danger-line);color:var(--danger)}
.chip .mono{font-size:11px}
.spacer{flex:1}
.iconbtn{width:32px;height:32px;border:0;background:transparent;border-radius:var(--r-btn);display:grid;place-items:center;color:var(--ink-2);cursor:pointer}
.iconbtn:hover{background:var(--line-2)}
.hide-sm{}
@media (max-width:640px){.hide-sm{display:none}}

/* dots */
.dot{display:inline-block;width:7px;height:7px;border-radius:2px;flex:none;background:var(--st-none)}
.dot.run{background:var(--st-run)}.dot.wait{background:var(--st-wait)}.dot.info{background:var(--st-info)}.dot.off{background:var(--st-off)}.dot.bad{background:var(--st-bad)}.dot.out{background:var(--out)}
.live .dot{border-radius:999px}
.live.on .dot{animation:pulse 2s var(--ease) infinite}
@keyframes pulse{50%{opacity:.35}}

/* page */
main{max-width:1440px;margin:0 auto;padding:20px 16px 48px;container-type:inline-size}
@media (min-width:768px){main{padding:24px 32px 64px}}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px;margin-bottom:16px}
.head h1{margin:0;font:500 20px/28px var(--font);letter-spacing:-.01em}
.head p{margin:2px 0 0;color:var(--ink-3)}
.seg{display:inline-flex;padding:2px;border-radius:8px;background:var(--line-2);gap:2px}
.seg button{border:0;background:transparent;height:26px;padding:0 10px;border-radius:6px;cursor:pointer;color:var(--ink-3);font-size:12.5px}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--ink);box-shadow:var(--sh-card)}

.card{background:var(--bg);border-radius:var(--r-card);box-shadow:var(--sh-card)}
.card-h{display:flex;align-items:center;gap:8px;padding:12px 16px;min-height:48px}
.card-h h2{margin:0;font:500 14px/20px var(--font)}
.card-h .spacer{flex:1}
.section-label{margin:24px 0 8px;display:flex;gap:8px;align-items:center}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@container (min-width:720px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container (min-width:1100px){.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}}
.kpi{padding:12px 14px 10px;min-width:0}
.kpi .k{color:var(--ink-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font:500 22px/30px var(--font);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px;display:flex;align-items:baseline;gap:8px}
.kpi .v small{font:400 12px/1 var(--font);color:var(--ink-3);letter-spacing:0}
.kpi .s{color:var(--ink-3);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi svg{display:block;width:100%;height:28px;margin-top:6px}
.kpi.alert .v{color:var(--danger)}

/* attention list */
.att{list-style:none;margin:0;padding:0}
.att li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line-2)}
.att li:first-child{border-top:0}
.att .t{min-width:0;flex:1}
.att .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att .t span{color:var(--ink-3);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att .val{font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.att .dot{margin-top:1px}
@container (max-width:640px){.att li{flex-wrap:wrap}.att .t b,.att .t span{white-space:normal}.att .t{flex-basis:calc(100% - 24px)}}

/* buttons */
.btn{height:28px;padding:0 10px;border-radius:var(--r-btn);border:0;cursor:pointer;font-size:12.5px;white-space:nowrap;background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-3);transition:background var(--dur) var(--ease)}
.btn:hover{background:var(--line-2)}
.btn.pri{background:var(--primary);color:var(--on-primary);box-shadow:none}
.btn.pri:hover{opacity:.9}
.btn.dan{color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger-line)}
.btn.dan:hover{background:var(--danger-bg)}
.btn.dan.solid{background:var(--danger);color:#fff;box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.step{display:inline-flex;align-items:center;border-radius:var(--r-btn);box-shadow:inset 0 0 0 1px var(--line-3);height:28px}
.step button{border:0;background:transparent;width:26px;height:28px;cursor:pointer;color:var(--ink-2)}
.step button:hover{background:var(--line-2)}
.step span{min-width:22px;text-align:center;font:500 12px var(--mono)}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:12.5px}

/* layout grid */
.grid{display:grid;gap:16px;margin-top:16px}
@container (min-width:1100px){.grid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}
.col{display:grid;gap:16px;align-content:start;min-width:0}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font:400 10.5px/16px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:8px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg-2);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right;white-space:nowrap}
.tbl td.mono{white-space:nowrap}
.tbl td:first-child,.tbl th:first-child{padding-left:16px}.tbl td:last-child,.tbl th:last-child{padding-right:16px}
.scroll{overflow:auto;max-height:520px}
.cmd{font-family:var(--mono);font-size:12px;color:var(--ink-2);display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd:focus,.cmd:hover{white-space:normal;word-break:break-all;overflow:visible}
.lane{display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.lane i{width:8px;height:8px;border-radius:999px;flex:none}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:var(--r-tag);font:400 10.5px/1 var(--mono);letter-spacing:.04em;background:var(--line-2);color:var(--ink-2);margin-left:4px;vertical-align:1px;white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn-fg)}.tag.bad{background:var(--danger-bg);color:var(--danger)}.tag.ok{background:var(--ok-bg);color:var(--ok-fg)}
.why{display:flex;gap:6px;align-items:flex-start;color:var(--ink-2);font-size:12.5px;line-height:18px}
.why .dot{margin-top:6px}
.why b{font-weight:500;color:var(--ink)}
.why+.why{margin-top:4px}
.bypass{margin-top:6px;font-size:12px;color:var(--ink-3)}
.bypass .bar{height:3px;border-radius:2px;background:var(--line-2);margin-top:4px;overflow:hidden;max-width:220px}
.bypass .bar i{display:block;height:100%;background:var(--st-wait)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:2px}
.cell-sub{color:var(--ink-3);font-size:12px}

/* machines */
.mach{padding:14px 16px;border-top:1px solid var(--line-2)}
.mach:first-of-type{border-top:0}
.mach-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mach-h b{font-size:13.5px}
.mach-h .spacer{flex:1}
.meter{margin-top:8px}
.meter .row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3)}
.meter .row b{color:var(--ink-2)}
.bar{position:relative;height:8px;border-radius:4px;background:var(--line-2);overflow:hidden;margin-top:4px}
.bar .used{position:absolute;inset:0 auto 0 0;background:var(--ink-4)}
.bar .rsv{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--st-wait) 0 3px,transparent 3px 6px);opacity:.8}
.bar .need{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.bar.load .used{background:var(--st-info)}
.bar.hot .used{background:var(--st-bad)}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.slot{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:var(--r-btn);font:400 11.5px/1 var(--mono);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-3);max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.slot.held{color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-3);background:var(--bg-2)}
.slot.outside{color:var(--out);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--out) 40%,transparent)}
.admits{margin-top:10px;display:flex;gap:6px;align-items:flex-start;font-size:12.5px;color:var(--ink-2)}
.admits .dot{margin-top:6px}

/* outside */
.out-head{padding:0 16px 12px;color:var(--ink-2);font-size:13px;line-height:20px}
.out-head b{color:var(--ink)}
.obars{padding:0 16px 14px;display:grid;gap:9px}
.obar .row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.obar .row span:first-child{font-family:var(--mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.obar .row span:last-child{color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.obar .bar{height:6px;margin-top:3px}
.obar .bar .used{background:var(--out)}
.obar.inq .bar .used{background:var(--st-run)}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 16px 14px;font-size:12px;color:var(--ink-3)}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* insights */
.ins{display:grid;gap:16px;margin-top:16px}
@container (min-width:1100px){.ins{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}
.chart{padding:4px 16px 14px}
.chart svg{display:block;width:100%;height:200px;overflow:visible}
.chart text{font:400 10.5px var(--mono);fill:var(--axis)}

.filter{height:28px;border-radius:var(--r-btn);border:0;box-shadow:inset 0 0 0 1px var(--line-3);background:var(--bg);color:var(--ink);padding:0 8px;font:inherit;font-size:12.5px;max-width:180px}

/* states */
.stale main{opacity:.6;transition:opacity 300ms}
.gate{max-width:480px;margin:12vh auto;padding:28px;text-align:center}
.gate h1{font:500 20px/28px var(--font);margin:12px 0 6px}
.gate p{color:var(--ink-3);margin:0}
.gate code{font-family:var(--mono);font-size:12px;background:var(--line-2);padding:2px 6px;border-radius:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#18181b;color:#fafafa;padding:10px 16px;border-radius:8px;box-shadow:var(--sh-menu);font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.toast.bad{background:var(--danger);color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true">hq</span>heavyq</div>
  <span class="chip hide-sm" id="hostchip" hidden><span class="mono" id="host"></span></span>
  <span class="chip" id="modechip" hidden></span>
  <div class="spacer"></div>
  <span class="chip live" id="live"><span class="dot"></span><span id="livetxt">connecting</span></span>
  <button class="iconbtn" id="theme" aria-label="Toggle theme" title="Toggle theme">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11" /><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor" stroke="none"/></svg>
  </button>
</header>
<div id="app"></div>
<div class="sr" aria-live="polite" id="announce"></div>
<script>
"use strict";
/* ───────── helpers ───────── */
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const sess={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};
function dur(s){s=Math.max(0,Math.round(s));if(s<60)return s+"s";if(s<3600){const m=Math.floor(s/60),r=s%60;return m+"m"+(r?" "+String(r).padStart(2,"0")+"s":"")}const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h+"h "+String(m).padStart(2,"0")+"m"}
function mb(v){if(!v)return "0 MB";return v>=1024?(v/1024).toFixed(v>=10240?0:1)+" GB":Math.round(v)+" MB"}
function cores(p){const c=p/100;return (c>=10?c.toFixed(0):c.toFixed(1))+(c===1?" core":" cores")}
const PAL=["--c1","--c2","--c3","--c4","--c5","--c6"];
function laneColor(l){let h=0;for(const ch of String(l))h=(h*31+ch.charCodeAt(0))>>>0;return `var(${PAL[h%PAL.length]})`}
const lane=l=>`<span class="lane" title="${esc(l)}"><i style="background:${laneColor(l)}"></i>${esc(l)}</span>`;
function reasonTone(r){if(r==="")return "run";if(/unreachable/.test(r))return "bad";if(/paused/.test(r))return "off";if(/^behind/.test(r))return "none";return "wait"}
function humanReason(r){
  if(r==="")return "nothing blocks it: starts on the next poll";
  return r.replace(/^RAM (\d+) MB \(minus (\d+) MB held for just-started jobs\) < (\d+) MB needed$/,(_,f,h,n)=>`RAM ${mb(+f)} free, ${mb(+h)} held for jobs that just started; needs ${mb(+n)}`)
          .replace(/^RAM (\d+) MB < (\d+) MB needed \(job (\d+) \+ reserve (\d+)\)$/,(_,f,n,j,r2)=>`RAM ${mb(+f)} free; needs ${mb(+n)} (job ${mb(+j)} + reserve ${mb(+r2)})`)
          .replace(/^load ([\d.]+) >= ([\d.]+) .*$/,(_,l,m)=>`load ${l} over the limit of ${(+m).toFixed(0)}`)
          .replace(/^paused.*$/,"machine paused")}
function sparkPath(vals,w,h){if(!vals.length)return "";const mx=Math.max(...vals,1),st=vals.length>1?w/(vals.length-1):0;return vals.map((v,i)=>(i?"L":"M")+(i*st).toFixed(1)+","+(h-2-(v/mx)*(h-4)).toFixed(1)).join("")}
function spark(vals,color){const p=sparkPath(vals,200,28);return `<svg viewBox="0 0 200 28" preserveAspectRatio="none" aria-hidden="true"><path d="${p} L200,28 L0,28 Z" fill="${color}" opacity=".08"/><path d="${p}" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`}

/* ───────── state ───────── */
const S={token:null,demo:false,meta:null,snap:null,at:0,ins:null,hist:null,win:store.get("hq.win")||"1h",laneFilter:"",confirm:null,stale:false,live:false};
const app=$("#app");

/* theme */
(function(){const t=store.get("hq.theme");if(t)document.documentElement.dataset.theme=t;
 $("#theme").onclick=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;const n=dark?"light":"dark";document.documentElement.dataset.theme=n;store.set("hq.theme",n);if(S.snap)render()}})();

/* token */
(function(){const h=location.hash;const m=h.match(/token=([0-9a-f]+)/);
 if(m){S.token=m[1];sess.set("hq.token",S.token);history.replaceState(null,"",location.pathname)}
 else if(h==="#demo"){S.demo=true}
 else S.token=sess.get("hq.token")})();

/* ───────── API ───────── */
async function api(path,opt={}){const r=await fetch("/api/v1/"+path,{...opt,headers:{"Authorization":"Bearer "+S.token,"Content-Type":"application/json"}});
 if(r.status===401){gate("Token rejected","The dashboard was restarted. Open the new link printed by <code>heavyq dash</code>.");throw new Error("401")}
 return r}
let toastT;function toast(msg,bad){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.className="toast"+(bad?" bad":"");t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),3500)}
async function act(path,body,ok){
 if(S.demo){demoAct(path,body);toast(ok);return}
 try{const r=await api(path,{method:"POST",body:JSON.stringify(body||{})});if(r.ok){toast(ok);return}
  const e=await r.json().catch(()=>({}));toast(e.error||("Request failed ("+r.status+")"),true)}catch(e){if(e.message!=="401")toast("Network error",true)}}

async function stream(){
 for(let delay=1000;;delay=Math.min(delay*2,10000)){
  try{const r=await api("stream");const rd=r.body.getReader(),dec=new TextDecoder();let buf="";setLive(true);delay=1000;
   for(;;){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf("\n\n"))>=0){const ev=buf.slice(0,i);buf=buf.slice(i+2);let name="message",data="";
     for(const l of ev.split("\n")){if(l.startsWith("event: "))name=l.slice(7);else if(l.startsWith("data: "))data+=l.slice(6)}
     if(name==="snapshot"&&data){try{onSnap(JSON.parse(data))}catch(e){}}}}}
  catch(e){if(e.message==="401")return}
  setLive(false);await new Promise(r=>setTimeout(r,delay))}}
async function loadInsights(){if(S.demo){S.ins=DEMO.insights;return render()}try{const r=await api("insights?window="+S.win);if(r.ok){S.ins=await r.json();render()}}catch(e){}}
async function loadHistory(){if(S.demo){S.hist=DEMO.history;return render()}try{const r=await api("history?n=200");if(r.ok){S.hist=(await r.json()).records;render()}}catch(e){}}
function onSnap(s){S.snap=s;S.at=Date.now();render()}
function setLive(on){S.live=on;S.stale=!on&&!!S.snap;document.body.classList.toggle("stale",S.stale);renderLive()}
function renderLive(){const el=$("#live");el.classList.toggle("on",S.live);el.className="chip live"+(S.demo?" warn":S.live?" on ok":S.snap?" bad":"");
 const age=S.at?Math.round((Date.now()-S.at)/1000):0;
 $("#livetxt").textContent=S.demo?"demo data":S.live?"live":S.snap?`disconnected · ${dur(age)} old · retrying`:"connecting"}

/* ───────── derived ───────── */
const el=()=>S.at?(Date.now()-S.at)/1000:0;
function attention(s){
 const out=[],e=el();
 for(const m of s.machines){
  if(!m.reachable)out.push({tone:"bad",title:`${m.name} is unreachable`,sub:"jobs that may only run there wait; others go elsewhere",val:"",act:null});
  else if(m.paused)out.push({tone:"off",title:`${m.name} is paused`,sub:"no new jobs start there; running jobs finish",val:"",act:{kind:"resume",m:m.name,label:"Resume"}});}
 const head=s.waiting[0];
 if(head){const w=head.wait_s+e;const blocked=Object.values(head.reasons).every(r=>r!=="");
  if(blocked&&w>60)out.push({tone:"wait",title:`${head.lane} has waited ${dur(w)} at the head of the queue`,sub:humanReason(firstReason(head)),val:"p"+head.prio,act:{kind:"prio",id:head.id,prio:head.prio}})}
 for(const t of s.running)if(t.forced)out.push({tone:"bad",title:`${t.lane} started through the anti-starvation bypass`,sub:"the machine was over its RAM/load limit for "+dur(s.config.force_after_s)+"; consider more slots elsewhere or a smaller job",val:t.machine,act:null});
 const ot=s.cpu&&s.cpu.available?s.cpu.outside_total:null,lm=s.machines.find(m=>m.name==="local");
 if(ot&&lm&&lm.total_mb&&ot.rss_mb/lm.total_mb>.4)out.push({tone:"out",title:`${mb(ot.rss_mb)} of RAM is used outside the queue`,sub:topOutside(s),val:Math.round(ot.rss_mb/lm.total_mb*100)+"% of RAM",act:null});
 if(S.ins&&S.ins.gave_up>0)out.push({tone:"wait",title:`${S.ins.gave_up} job${S.ins.gave_up>1?"s":""} gave up waiting in the last ${S.win}`,sub:"they hit --max-wait or their remote was down: agents saw a failure without running anything",val:"",act:null});
 return out}
function firstReason(t){for(const r of Object.values(t.reasons))if(r)return r;return ""}
function topOutside(s){const o=s.cpu.outside[0];return o?`${o.name} ×${o.procs} alone holds ${mb(o.rss_mb)}`:""}

/* ───────── render ───────── */
function gate(title,html){app.innerHTML=`<div class="gate card"><span class="mark" style="margin:auto;width:32px;height:32px;font-size:13px">hq</span><h1>${title}</h1><p>${html}</p></div>`}
function render(){
 const s=S.snap;if(!s)return;renderLive();
 $("#hostchip").hidden=false;$("#host").textContent=s.host+" · v"+s.version;
 const mc=$("#modechip");mc.hidden=false;
 if(S.demo){mc.className="chip warn";mc.textContent="demo"}
 else if(S.meta&&S.meta.control){mc.className="chip ok";mc.textContent="control"}
 else{mc.className="chip";mc.innerHTML=`read-only<span class="hide-sm mute"> · start with <span class="mono">--control</span> to act</span>`}
 const focus=document.activeElement&&document.activeElement.id;
 const scroll=[...document.querySelectorAll(".scroll")].map(x=>x.scrollTop);
 app.innerHTML=`<main>${pageHead(s)}${kpis(s)}${attentionBlock(s)}<div class="grid"><div class="col">${running(s)}${waiting(s)}${coalesced(s)}</div><div class="col">${machines(s)}${outside(s)}</div></div>${insights()}${recent()}</main>`;
 document.querySelectorAll(".scroll").forEach((x,i)=>x.scrollTop=scroll[i]||0);
 if(focus){const f=document.getElementById(focus);if(f)f.focus()}}
const canAct=()=>S.demo||(S.meta&&S.meta.control);

function pageHead(s){const m=s.machines.length;return `<div class="head"><div><h1>Queue</h1><p>${m} machine${m>1?"s":""} · gate ${s.config.resource_gate?"on":"off (slots only)"} · bypass after ${dur(s.config.force_after_s)}</p></div><div class="spacer" style="flex:1"></div>
 <div class="seg" role="group" aria-label="Insights window">${["1h","6h","24h","7d"].map(w=>`<button data-win="${w}" aria-pressed="${S.win===w}">${w}</button>`).join("")}</div></div>`}

function kpis(s){const e=el(),i=S.ins,b=i?i.buckets:[];
 const headWait=s.waiting[0]?s.waiting[0].wait_s+e:0;
 const runCores=s.running.filter(t=>t.machine==="local").reduce((a,t)=>a+t.cpu_pct,0);
 const saved=i?i.cache_hits+i.coalesced:0;
 const tiles=[
  {k:"Running",v:s.running.length,u:"",sub:s.running.length?cores(runCores)+" local":"idle",sp:null},
  {k:"Waiting",v:s.waiting.length,u:"",sub:s.waiting.length?"head waited "+dur(headWait):"nobody waits",sp:null,alert:headWait>s.config.force_after_s*.66},
  {k:"Wait p95 · "+S.win,v:i?dur(i.wait_p95_s):"—",u:"",sub:i?"p50 "+dur(i.wait_p50_s)+" · max "+dur(i.wait_max_s):"",sp:b.map(x=>x.wait_p95_s),c:"var(--st-wait)"},
  {k:"Runs · "+S.win,v:i?i.runs:"—",u:"",sub:i?(i.failed+" failed · "+dur(i.run_s)+" busy"):"",sp:b.map(x=>x.runs),c:"var(--c1)"},
  {k:"Gave up · "+S.win,v:i?i.gave_up:"—",u:"",sub:i?(i.forced+" forced · "+i.cancelled+" cancelled"):"",sp:b.map(x=>x.gave_up),c:"var(--st-bad)",alert:i&&i.gave_up>0},
  {k:"Didn't need to run",v:i?saved:"—",u:"",sub:i?(i.cache_hits+" cache hits · "+i.coalesced+" coalesced"):"",sp:null}];
 return `<div class="kpis">${tiles.map(t=>`<div class="card kpi${t.alert?" alert":""}"><div class="k">${esc(t.k)}</div><div class="v num">${esc(t.v)}</div><div class="s">${esc(t.sub)}</div>${t.sp&&t.sp.length?spark(t.sp,t.c):'<svg viewBox="0 0 200 28" aria-hidden="true"></svg>'}</div>`).join("")}</div>`}

function attentionBlock(s){const a=attention(s);
 return `<div class="section-label"><span class="label">Needs attention · ${a.length}</span></div><div class="card">${a.length?`<ul class="att">${a.map(x=>`<li><span class="dot ${x.tone}"></span><div class="t"><b>${esc(x.title)}</b><span>${esc(x.sub)}</span></div>${x.val?`<span class="val">${esc(x.val)}</span>`:""}${attAction(x.act)}</li>`).join("")}</ul>`:`<div class="empty"><b>All clear</b>Every waiting job has a free path, and nothing is starving.</div>`}</div>`}
function attAction(a){if(!a||!canAct())return "";if(a.kind==="resume")return `<button class="btn pri" data-act="resume" data-m="${esc(a.m)}">Resume</button>`;
 if(a.kind==="prio")return a.prio>1?`<button class="btn pri" data-act="prio" data-id="${esc(a.id)}" data-v="${a.prio-1}">Raise to p${a.prio-1}</button>`:"";return ""}

function cancelCell(t){if(!canAct())return "";
 if(t.cancel_requested)return `<span class="tag warn">stopping…</span>`;
 if(S.confirm===t.id)return `<span class="confirm">Cancel? <button class="btn dan solid" data-act="cancel" data-id="${esc(t.id)}" id="cf-yes">Yes</button><button class="btn" data-act="noconfirm">No</button></span>`;
 return `<button class="btn dan" data-act="confirm" data-id="${esc(t.id)}" aria-label="Cancel ${esc(t.lane)}">Cancel</button>`}

function running(s){const e=el();
 const rows=s.running.map(t=>`<tr><td>${lane(t.lane)}<div class="cell-sub">p${t.prio}${t.light?'<span class="tag">light</span>':""}${t.forced?'<span class="tag bad">forced</span>':""}${t.machine!=="local"?'<span class="tag">remote</span>':""}</div></td>
  <td style="max-width:0;width:40%"><span class="cmd" tabindex="0" title="${esc(t.cmd)}">${esc(t.cmd)}</span><div class="cell-sub">waited ${dur(t.wait_s)}</div></td>
  <td class="mono">${esc(t.machine)}<span class="mute">/${esc(t.slot)}</span></td>
  <td class="r num">${dur(t.run_s+e)}</td>
  <td class="r num">${t.machine==="local"?cores(t.cpu_pct):"—"}<div class="cell-sub">${t.rss_mb?mb(t.rss_mb):""}</div></td>
  <td class="r">${cancelCell(t)}</td></tr>`).join("");
 return `<div class="card"><div class="card-h"><span class="dot run"></span><h2>Running</h2><span class="mute num">${s.running.length}</span></div>
 ${s.running.length?`<div class="scroll"><table class="tbl"><thead><tr><th>Lane</th><th>Command</th><th>Where</th><th class="r">Time</th><th class="r">CPU · RAM</th><th class="r"><span class="sr">Actions</span></th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty"><b>Nothing running</b>Heavy commands from your agents appear here.</div>`}</div>`}

function waiting(s){const e=el();
 const rows=s.waiting.map(t=>{const rs=Object.entries(t.reasons);const shown=t.position===1?rs:rs.filter(([,r])=>r!=="").slice(0,1);
  const why=(shown.length?shown:rs).map(([m,r])=>`<div class="why"><span class="dot ${reasonTone(r)}"></span><span><b>${esc(m)}</b> · ${esc(humanReason(r))}</span></div>`).join("");
  let by="";if(t.bypass_in_s>=0&&s.config.resource_gate){const left=Math.max(0,t.bypass_in_s-e),pct=100-left/s.config.force_after_s*100;
   by=`<div class="bypass">${left>0?`gate bypass in <b class="num">${dur(left)}</b>`:"gate bypass applies now"}<div class="bar"><i style="width:${Math.min(100,Math.max(0,pct)).toFixed(1)}%"></i></div></div>`}
  const prio=canAct()&&!t.cancel_requested?`<span class="step" role="group" aria-label="Priority of ${esc(t.lane)}"><button data-act="prio" data-id="${esc(t.id)}" data-v="${Math.max(1,t.prio-1)}" aria-label="Raise priority" ${t.prio<=1?"disabled":""}>−</button><span>p${t.prio}</span><button data-act="prio" data-id="${esc(t.id)}" data-v="${Math.min(9,t.prio+1)}" aria-label="Lower priority" ${t.prio>=9?"disabled":""}>+</button></span>`:`<span class="mono">p${t.prio}</span>`;
  return `<tr><td class="num mute">${t.position}</td><td>${lane(t.lane)}<div class="cell-sub">${esc(t.target)}${t.light?'<span class="tag">light</span>':""}</div></td>
  <td style="max-width:0;width:34%"><span class="cmd" tabindex="0" title="${esc(t.cmd)}">${esc(t.cmd)}</span><div class="cell-sub num">waited ${dur(t.wait_s+e)}</div></td>
  <td style="min-width:220px">${why}${by}</td><td>${prio}</td><td class="r">${cancelCell(t)}</td></tr>`}).join("");
 return `<div class="card"><div class="card-h"><span class="dot wait"></span><h2>Waiting</h2><span class="mute num">${s.waiting.length}</span><span class="spacer"></span><span class="label">turn order</span></div>
 ${s.waiting.length?`<div class="scroll"><table class="tbl"><thead><tr><th>#</th><th>Lane</th><th>Command</th><th>Why it waits</th><th>Prio</th><th class="r"><span class="sr">Actions</span></th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty"><b>Nobody waits</b>Every job got a slot right away.</div>`}</div>`}

function coalesced(s){if(!s.coalesced.length)return "";const e=el();
 return `<div class="card"><div class="card-h"><span class="dot info"></span><h2>Sharing one result</h2><span class="mute num">${s.coalesced.length}</span></div><ul class="att">${s.coalesced.map(g=>{const n=g.followers.length+(g.leader?1:0);const cmd=(g.leader||g.followers[0]).cmd;
  return `<li><span class="dot info"></span><div class="t"><b>${n} runs share one result</b><span class="mono">${esc(cmd)}</span><span>${g.leader?`leader ${esc(g.leader.lane)} · running ${dur((Date.now()-Date.parse(g.leader.since))/1000)}`:"leader finishing"} · waiting: ${g.followers.map(f=>esc(f.lane)).join(", ")}</span></div></li>`}).join("")}</ul></div>`}

function machines(s){return `<div class="card"><div class="card-h"><h2>Machines</h2><span class="spacer"></span><span class="label">heavy job needs RAM + slot</span></div>${s.machines.map(m=>{
 const tone=!m.reachable?"bad":m.paused?"off":m.admits===""?"run":"wait";
 const ctl=canAct()&&m.reachable?`<button class="btn" data-act="${m.paused?"resume":"pause"}" data-m="${esc(m.name)}">${m.paused?"Resume":"Pause"}</button>`:"";
 let body="";
 if(!m.reachable)body=`<div class="admits"><span class="dot bad"></span>unreachable: probes fail; jobs that can only run here wait or give up after the remote-down limit</div>`;
 else{
  if(m.metrics_known){const total=m.total_mb||Math.max(m.free_mb+m.job_mb+m.reserve_mb,m.free_mb*1.25);
   const used=Math.max(0,total-m.free_mb),need=m.job_mb+m.reserve_mb;
   const usedPct=used/total*100,rsvPct=Math.min(m.reserved_mb/total*100,100-usedPct),needPos=Math.max(0,100-need/total*100);
   const loadPct=Math.min(100,m.load1/Math.max(m.max_load,.01)*100*0.8);
   body+=`<div class="meter"><div class="row"><span>RAM</span><span><b class="num">${mb(m.free_mb)}</b> free${m.total_mb?" of "+mb(m.total_mb):""} · needs ${mb(need)}</span></div>
    <div class="bar" title="free must stay right of the marker"><div class="used" style="width:${usedPct.toFixed(1)}%"></div><div class="rsv" style="left:${usedPct.toFixed(1)}%;width:${rsvPct.toFixed(1)}%"></div><div class="need" style="left:${needPos.toFixed(1)}%"></div></div></div>
    <div class="meter"><div class="row"><span>Load</span><span><b class="num">${m.load1.toFixed(1)}</b> / ${m.max_load.toFixed(0)} limit · ${m.cores} cores</span></div>
    <div class="bar load${m.load1>=m.max_load?" hot":""}"><div class="used" style="width:${loadPct.toFixed(1)}%"></div><div class="need" style="left:80%"></div></div></div>`}
  else body+=`<div class="admits"><span class="dot off"></span>resources not measured on this platform: slots only</div>`;
  body+=`<div class="slots">${m.slots.map(x=>`<span class="slot ${x.state}" title="${esc(x.name)}: ${x.state==="held"?esc(x.lane):x.state==="outside"?"locked outside the queue":"free"}">${x.state==="held"?`<i class="dot" style="background:${laneColor(x.lane)};border-radius:999px"></i>`:x.state==="outside"?'<i class="dot out"></i>':'<i class="dot"></i>'}${esc(x.name)}${x.state==="held"?" · "+esc(x.lane):x.state==="outside"?" · outside":""}</span>`).join("")}</div>
   <div class="admits"><span class="dot ${tone}"></span>${m.paused?"paused: no new jobs start here":m.admits===""?"ready for a heavy job":esc(humanReason(m.admits))}</div>`}
 return `<div class="mach"><div class="mach-h"><span class="dot ${tone}"></span><b>${esc(m.name)}</b>${m.paused?'<span class="tag">paused</span>':""}<span class="spacer"></span>${ctl}</div>${body}</div>`}).join("")}</div>`}

function outside(s){const c=s.cpu;if(!c||!c.available)return `<div class="card"><div class="card-h"><h2>Outside the queue</h2></div><div class="empty">Process accounting needs Linux (/proc).</div></div>`;
 const lm=s.machines.find(m=>m.name==="local")||{},total=lm.total_mb||1,ot=c.outside_total,lanesRss=c.lanes.reduce((a,u)=>a+u.rss_mb,0);
 const max=Math.max(...c.outside.map(u=>u.rss_mb),...c.lanes.map(u=>u.rss_mb),1);
 const row=(u,cls)=>`<div class="obar ${cls}"><div class="row"><span>${esc(u.name)}${u.procs>1?` <span class="mute">×${u.procs}</span>`:""}</span><span>${mb(u.rss_mb)} · ${cores(u.cpu_pct)}</span></div><div class="bar"><div class="used" style="width:${(u.rss_mb/max*100).toFixed(1)}%"></div></div></div>`;
 return `<div class="card"><div class="card-h"><span class="dot out"></span><h2>Outside the queue</h2><span class="spacer"></span><span class="label">local · now</span></div>
 <div class="out-head">Outside the queue: <b>${mb(ot.rss_mb)}</b> and <b>${cores(ot.cpu_pct)}</b>${lm.total_mb?` (${Math.round(ot.rss_mb/total*100)}% of RAM)`:""}. Queued jobs use ${mb(lanesRss)}.${c.outside[0]?` <b>${esc(c.outside[0].name)}</b> ×${c.outside[0].procs} alone holds ${mb(c.outside[0].rss_mb)}.`:""}</div>
 <div class="obars">${c.outside.map(u=>row(u,"")).join("")}${c.lanes.map(u=>row({...u,name:"lane "+u.name},"inq")).join("")}</div>
 <div class="legend"><span><i class="dot out"></i>not started by heavyq</span><span><i class="dot run"></i>queued jobs</span></div></div>`}

function insights(){const i=S.ins;if(!i)return "";
 const b=i.buckets,W=600,H=180,mx=Math.max(...b.map(x=>x.runs),1),mw=Math.max(...b.map(x=>x.wait_p95_s),1),bw=W/b.length;
 const bars=b.map((x,k)=>{const h=x.runs/mx*(H-24);return `<rect x="${(k*bw+bw*.2).toFixed(1)}" y="${(H-h).toFixed(1)}" width="${(bw*.6).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--c1)" opacity=".85"><title>${x.runs} runs</title></rect>${x.gave_up?`<circle cx="${(k*bw+bw/2).toFixed(1)}" cy="${(H-h-8).toFixed(1)}" r="3" fill="var(--st-bad)"><title>${x.gave_up} gave up</title></circle>`:""}`}).join("");
 const line=b.map((x,k)=>(k?"L":"M")+(k*bw+bw/2).toFixed(1)+","+(H-x.wait_p95_s/mw*(H-24)).toFixed(1)).join("");
 const fmt=t=>{const d=new Date(t);return S.win==="7d"?(d.getMonth()+1)+"/"+d.getDate():String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
 const ticks=b.map((x,k)=>k%3===0?`<text x="${(k*bw+bw/2).toFixed(1)}" y="${H+16}" text-anchor="middle">${fmt(x.start)}</text>`:"").join("");
 const grid=[.25,.5,.75,1].map(f=>`<line x1="0" x2="${W}" y1="${(H-f*(H-24)).toFixed(1)}" y2="${(H-f*(H-24)).toFixed(1)}" stroke="var(--grid)" stroke-dasharray="2 3"/>`).join("");
 const lanes=i.lanes.slice(0,8).map(l=>`<tr><td>${lane(l.lane)}</td><td class="r num">${l.runs}</td><td class="r num">${l.failed?`<span style="color:var(--danger)">${l.failed}</span>`:0}</td><td class="r num">${l.gave_up||0}</td><td class="r num">${dur(l.wait_p50_s)}</td><td class="r num">${dur(l.run_s)}</td></tr>`).join("");
 return `<div class="section-label"><span class="label">Last ${S.win}</span></div><div class="ins">
  <div class="card"><div class="card-h"><h2>Runs and waiting</h2><span class="spacer"></span><span class="legend" style="padding:0"><span><i class="dot info"></i>runs</span><span><i class="dot wait"></i>wait p95</span><span><i class="dot bad" style="border-radius:999px"></i>gave up</span></span></div>
   <div class="chart">${i.runs||i.gave_up?`<svg viewBox="0 0 ${W} ${H+20}" role="img" aria-label="Runs per period with wait p95">${grid}${bars}<path d="${line}" fill="none" stroke="var(--st-wait)" stroke-width="2" vector-effect="non-scaling-stroke"/>${ticks}</svg>`:`<div class="empty"><b>No runs in this window</b>History fills as jobs finish.</div>`}</div></div>

const OUT={"":["ok","ran"],gave_up:["warn","gave up"],cancelled:["","cancelled"],interrupted:["","interrupted"]};
function recent(){const h=S.hist;if(!h)return "";const ls=[...new Set(h.map(r=>r.lane))].sort();
 const rows=h.slice().reverse().filter(r=>!S.laneFilter||r.lane===S.laneFilter).slice(0,60).map(r=>{let [tone,txt]=OUT[r.result||""]||["",r.result];
  if(!r.result&&r.exit!==0){tone="bad";txt="exit "+r.exit}
  const cache=r.cache==="hit"||r.cache==="coalesced"?`<span class="tag ok">${r.cache==="hit"?"cache hit":"coalesced"}</span>`:"";
  const d=new Date(r.end);
  return `<tr><td class="mono mute">${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}</td><td>${lane(r.lane)}</td><td style="max-width:0;width:38%"><span class="cmd" tabindex="0" title="${esc(r.cmd)}">${esc(r.cmd)}</span></td>
  <td><span class="tag ${tone}">${esc(txt)}</span>${cache}${r.forced?'<span class="tag bad">forced</span>':""}</td><td class="mono">${esc(r.machine||"—")}</td><td class="r num">${dur(r.wait_s)}</td><td class="r num">${r.run_s?dur(r.run_s):"—"}</td><td class="r num">${r.cpu_s?cores(r.cpu_s/Math.max(r.run_s,1)*100):"—"}<div class="cell-sub">${r.max_rss_mb?mb(r.max_rss_mb)+" peak":""}</div></td></tr>`}).join("");
 return `<div class="section-label"><span class="label">Recent runs</span></div><div class="card"><div class="card-h"><h2>History</h2><span class="spacer"></span>
  <label class="sr" for="lanef">Filter by lane</label><select class="filter" id="lanef"><option value="">All lanes</option>${ls.map(l=>`<option ${l===S.laneFilter?"selected":""}>${esc(l)}</option>`).join("")}</select></div>
  ${rows?`<div class="scroll"><table class="tbl"><thead><tr><th>End</th><th>Lane</th><th>Command</th><th>Result</th><th>Machine</th><th class="r">Wait</th><th class="r">Run</th><th class="r">Avg CPU · peak</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty"><b>No runs recorded yet</b>Finished jobs are listed here.</div>`}</div>`}

document.addEventListener("click",ev=>{

 const b=ev.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
 if(a==="confirm"){S.confirm=b.dataset.id;render();const y=$("#cf-yes");if(y)y.focus();return}
 if(a==="noconfirm"){S.confirm=null;render();return}
 if(a==="cancel"){S.confirm=null;const t=[...S.snap.running,...S.snap.waiting].find(x=>x.id===b.dataset.id);if(t)t.cancel_requested=true;render();
  act("tickets/"+encodeURIComponent(b.dataset.id)+"/cancel",null,"Cancel requested: the job stops within a few seconds");return}
 if(a==="prio"){act("tickets/"+encodeURIComponent(b.dataset.id)+"/prio",{prio:+b.dataset.v},"Priority p"+b.dataset.v+" requested: applied on the next poll");return}
 if(a==="pause"||a==="resume"){act("machines/"+encodeURIComponent(b.dataset.m)+"/"+a,null,b.dataset.m+(a==="pause"?" paused":" resumed"));if(!S.demo)setTimeout(async()=>{try{const r=await api("snapshot");if(r.ok)onSnap(await r.json())}catch(e){}},300)}});
document.addEventListener("change",ev=>{if(ev.target.id==="lanef"){S.laneFilter=ev.target.value;render()}});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&S.confirm){S.confirm=null;render()}});
setInterval(()=>{if(S.snap&&!document.hidden&&!S.confirm&&!document.querySelector(".cmd:focus,select:focus"))render();else renderLive()},1000);
