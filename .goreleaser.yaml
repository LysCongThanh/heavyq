version: 2

project_name: heavyq

before:
  hooks:
    - go mod tidy
    # heavyq(1), generated from the command table; shipped in every archive (see archives.files).
    - go run ./tools/mangen -version {{ .Version }} -date {{ .CommitDate }} -o man/heavyq.1

builds:
  - main: .
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/LysCongThanh/heavyq/internal/cli.Version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible binaries

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - examples/**/*
      - src: man/*.1
        dst: man/man1
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: scripts/install.sh # listed in checksums.txt, so the signature below covers it too

# cosign keyless signatures (Sigstore, GitHub OIDC; the release workflow grants id-token and installs cosign).
# Each archive and checksums.txt gets a <file>.sigstore.json bundle (signature, certificate, transparency
# log entry). Scorecard's Signed-Releases check reads these assets; a snapshot build skips signing.
signs:
  - id: archives
    cmd: cosign
    artifacts: archive
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]

# SPDX SBOM per archive (syft is installed by the release workflow).
sboms:
  - artifacts: archive

release:
  extra_files:
    - glob: scripts/install.sh
  footer: |
    ---
    **Install** (checks the sha256 of the archive): `curl -fsSL https://github.com/LysCongThanh/heavyq/releases/download/v{{ .Version }}/install.sh | sh`

    **Verify a download** (build provenance and a cosign signature, both from GitHub Actions through Sigstore):

    ```bash
    gh attestation verify heavyq_{{ .Version }}_linux_amd64.tar.gz --repo LysCongThanh/heavyq
    cosign verify-blob --bundle heavyq_{{ .Version }}_linux_amd64.tar.gz.sigstore.json \
      --certificate-identity "https://github.com/LysCongThanh/heavyq/.github/workflows/release.yml@refs/tags/v{{ .Version }}" \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com heavyq_{{ .Version }}_linux_amd64.tar.gz
    ```

# Used only when CHANGELOG.md has no section for the tag (see .github/workflows/release.yml).
changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:", "^chore:", "^build\\(deps\\):"]
