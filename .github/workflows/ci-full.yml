name: ci-full

# The full tier: everything the fast tier (ci.yml, on every pull request) leaves out because it is slow or
# rarely changes with a pull request. It runs on every push to main, nightly, on demand, and on a pull request
# that carries the label ci:full. Without the label a pull request run only shows these jobs as skipped.
# Label a PR ci:full when it touches locks, processes, the queue, macOS behaviour or the release build.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  schedule:
    - cron: "17 4 * * *" # nightly: new Go vulnerabilities and flakes surface without a code change
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Events that never run the suite (opened: the labeled event follows; another label added) get their own
  # group, so they cannot cancel a real run and leave a stale cancelled check on the pull request.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event.action == 'opened' || (github.event.action == 'labeled' && github.event.label.name != 'ci:full')) && github.run_id || 'suite' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The whole suite under the race detector, through heavyq itself: the gate "ready" in heavyq.toml (gofmt, vet,
  # go test -race, which includes every end-to-end run with real processes and an sh -c "remote").
  race:
    if: ${{ github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci:full') && github.event.action != 'opened' && (github.event.action != 'labeled' || github.event.label.name == 'ci:full')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go build -o heavyq .
      - name: gate ready (heavyq gate run ready)
        run: ./heavyq gate run ready

  # macOS parity (no /proc there): local RAM/load from sysctl and vm_stat, processes from ps. Runs the tests
  # that need neither Linux-only features (subreaper, util-linux, /proc fixtures) nor the full e2e suite: the
  # metrics and ps parsers, process breakdown/descendants against real processes, and the status/cancel runs.
  macos:
    if: ${{ github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci:full') && github.event.action != 'opened' && (github.event.action != 'labeled' || github.event.label.name == 'ci:full')) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go build ./... && go vet ./...
      - name: macOS subset
        run: go test -race -count=1 ./internal/metrics/... ./internal/procinfo/... ./internal/cli/... -run 'Metrics|Breakdown|Descendants|Cancel|Status|PS|Parse|Host|StartTime|Local'
      - name: heavyq top (terminal, width, render, input, loop)
        run: go test -race -count=1 ./internal/tui/...

  # install.sh (attached to every release) on both platforms it supports: against a local fake release
  # (checksum match, mismatch, tampering, --verify plumbing) and against the real v0.3.0 and latest releases.
  install-script:
    if: ${{ github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci:full') && github.event.action != 'opened' && (github.event.action != 'labeled' || github.event.label.name == 'ci:full')) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck scripts/*.sh
      - name: install.sh tests
        env:
          HEAVYQ_TEST_NETWORK: "1"
        run: sh scripts/test-install.sh

  # Same goreleaser config as the tag build, minus publishing: cross-builds, archives, SBOMs.
  release-snapshot:
    if: ${{ github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci:full') && github.event.action != 'opened' && (github.event.action != 'labeled' || github.event.label.name == 'ci:full')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=sign # signing needs the release job's OIDC token
      - name: archives hold the man page and the install script is listed in checksums.txt
        run: |
          for a in dist/heavyq_*.tar.gz; do
            tar -tzf "$a" | grep -qx 'man/man1/heavyq.1' || { echo "::error::$a has no man/man1/heavyq.1"; exit 1; }
          done
          grep -q ' install.sh$' dist/checksums.txt || { echo "::error::install.sh is not in checksums.txt"; exit 1; }

  govulncheck:
    if: ${{ github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci:full') && github.event.action != 'opened' && (github.event.action != 'labeled' || github.event.label.name == 'ci:full')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: stable

  # Intra-repo Markdown links (files and #anchors) must resolve: the README is an index into docs/.
  doc-links:
    if: ${{ github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci:full') && github.event.action != 'opened' && (github.event.action != 'labeled' || github.event.label.name == 'ci:full')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -I .github/scripts/check-md-links.py

  # The long form of the fuzz: every target of .github/fuzz-targets.txt for 2 minutes (a pull request fuzzes only
  # the packages it touched, for 20 s, in ci.yml). A crasher fails the job and is uploaded: commit it under
  # testdata/fuzz as the regression test.
  fuzz-plan:
    if: ${{ github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci:full') && github.event.action != 'opened' && (github.event.action != 'labeled' || github.event.label.name == 'ci:full')) }}
    runs-on: ubuntu-latest
    outputs:
      fuzz: ${{ steps.plan.outputs.fuzz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          EVENT_NAME: push # every target, whatever started this run
        run: .github/scripts/ci-plan.sh

  fuzz:
    needs: fuzz-plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.fuzz-plan.outputs.fuzz) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: fuzz ${{ matrix.pkg }}
        env:
          PKG: ${{ matrix.pkg }}
          TARGETS: ${{ matrix.targets }}
        run: .github/scripts/run-fuzz.sh "$PKG" "$TARGETS" 2m
      - name: upload crashers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.pkg }}
          path: internal/${{ matrix.pkg }}/testdata/fuzz
          if-no-files-found: ignore
