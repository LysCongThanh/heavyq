name: ci

# The fast tier: what every pull request (and every push to main) runs, in about 5 minutes. The slow checks
# (the whole suite under -race, macOS, the release snapshot, install.sh, govulncheck, the long fuzz, doc links)
# are in ci-full.yml: pushes to main, nightly, and a PR labelled ci:full. changelog.yml and pr.yml are the other
# per-PR checks.
#
# The required check is `test`. A pull request that changes only documentation must still get it, so the job
# always runs and always passes, and skips its Go steps (a workflow-level paths filter would leave a required
# check pending forever). The other Go jobs (schemas, lint, fuzz) wait for `changes` and are skipped the same way.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What the pull request touches: go (any change that is not documentation) and fuzz (the packages with fuzz
  # targets it touched). See .github/scripts/ci-plan.sh.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.plan.outputs.go }}
      fuzz: ${{ steps.plan.outputs.fuzz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: .github/scripts/ci-plan.sh

  # REQUIRED. gofmt, vet, build, the hot-path latency gate, then every unit and end-to-end test (real processes,
  # real locks, an sh -c "remote") without -race: the gate "fast" in heavyq.toml, run through the binary just
  # built. The same suite under -race runs in ci-full.yml (gate "ready"). It decides for itself whether the pull
  # request is documentation only, so it never waits for another job and always reports.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: .github/scripts/ci-plan.sh
      - if: steps.plan.outputs.go == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - if: steps.plan.outputs.go == 'true'
        run: go build -o heavyq .
      # Latency gate for hot paths: on a generated 100,000-record ledger, the tail read of 2,000 records and the
      # hook path through the ledger index, and the flow-state read behind the status line, top and the brief, must
      # stay inside their budgets (skipped under -race and by gate fast, so run here; a drift test in
      # internal/history/historytest keeps this list in step with the tests the fast gate skips).
      - name: hot-path latency (tail reader, hook path under 20 ms, flow-state read under 5 ms)
        if: steps.plan.outputs.go == 'true'
        run: go test -count=1 -run 'Latency|HookPathUnder20ms' ./internal/history ./internal/ledgerindex ./internal/flowstate
      - name: gate fast (heavyq gate run fast)
        if: steps.plan.outputs.go == 'true'
        run: ./heavyq gate run fast
      - name: documentation only, nothing to build
        if: steps.plan.outputs.go != 'true'
        run: echo "this pull request changes only documentation; the Go checks are skipped"

  # JSON Schemas (schema/) are generated from the Go types by tools/schemagen, a separate module that holds
  # the only extra dependencies. Its tests also validate heavyq.toml and examples/config.toml against them;
  # then the files are regenerated and must not differ from what is committed.
  schemas:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: schemagen tests
        working-directory: tools/schemagen
        run: go test -count=1 ./...
      - name: regenerate
        working-directory: tools/schemagen
        run: go run .
      - name: schema/ is up to date
        run: |
          if ! git diff --exit-code -- schema/; then
            echo "::error::schema/ is stale. Run 'cd tools/schemagen && go run .' and commit the result."
            exit 1
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0 # also covers gofmt (see .golangci.yml)

  # Go native fuzzing of the parsers that read untrusted input, in its short form: a pull request fuzzes the
  # packages it touched (all of them when it changes the fuzz plumbing) for 20 s per target. The long form, every
  # target for 2 m, is in ci-full.yml. A crasher fails the job and is uploaded: commit it under testdata/fuzz as
  # the regression test. The targets are listed in .github/fuzz-targets.txt.
  fuzz:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.fuzz != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.fuzz) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: fuzz ${{ matrix.pkg }}
        env:
          PKG: ${{ matrix.pkg }}
          TARGETS: ${{ matrix.targets }}
        run: .github/scripts/run-fuzz.sh "$PKG" "$TARGETS" 20s
      - name: upload crashers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.pkg }}
          path: internal/${{ matrix.pkg }}/testdata/fuzz
          if-no-files-found: ignore

  # Secrets can be in documentation too, so this one never skips.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --verbose
