name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly: new Go vulnerabilities surface without a code change
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go build -o heavyq .
      # heavyq proves itself: the gate in heavyq.toml (gofmt, go vet and `go test -race`, which includes the
      # end-to-end runs with real processes and an sh -c "remote"), run through the binary just built.
      # A failing command fails the job, and its output is shown as usual.
      - name: gate ready (heavyq gate run ready)
        run: ./heavyq gate run ready

  # macOS parity (no /proc there): local RAM/load from sysctl and vm_stat, processes from ps. Runs the tests
  # that need neither Linux-only features (subreaper, util-linux, /proc fixtures) nor the full e2e suite: the
  # metrics and ps parsers, process breakdown/descendants against real processes, and the status/cancel runs.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go build ./... && go vet ./...
      - name: macOS subset
        run: go test -race -count=1 ./internal/metrics/... ./internal/procinfo/... ./internal/cli/... -run 'Metrics|Breakdown|Descendants|Cancel|Status|PS|Parse|Host|StartTime|Local'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0 # also covers gofmt (see .golangci.yml)

  # Go native fuzzing of the parsers that read untrusted input. A pull request fuzzes a package only when
  # it touched it (or this workflow), for 20 s per target; the weekly schedule runs every target for 2 m.
  # A crasher fails the job and is uploaded: commit it under testdata/fuzz as the regression test.
  fuzz:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {pkg: hook, targets: "FuzzParse FuzzDecideRewrite FuzzDecideStdin"}
          - {pkg: redact, targets: "FuzzCommand"}
          - {pkg: anchor, targets: "FuzzParse FuzzSetChecked"}
          - {pkg: repoconfig, targets: "FuzzParse"}
          - {pkg: config, targets: "FuzzParse"}
          - {pkg: history, targets: "FuzzReadLast"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changed-files check diffs against the base branch
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: fuzz ${{ matrix.pkg }}
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PKG: ${{ matrix.pkg }}
          TARGETS: ${{ matrix.targets }}
        run: |
          fuzztime=2m
          if [ "$EVENT" = pull_request ]; then
            fuzztime=20s
            if ! git diff --name-only "origin/${BASE_REF}...HEAD" | grep -Eq "^(internal/${PKG}/|\.github/workflows/ci\.yml$)"; then
              echo "internal/${PKG} unchanged: skipping its fuzz targets"
              exit 0
            fi
          fi
          for target in $TARGETS; do
            echo "::group::fuzz ${PKG} ${target} (${fuzztime})"
            go test "./internal/${PKG}" -run '^$' -fuzz "^${target}\$" -fuzztime "$fuzztime" -fuzzminimizetime 10s
            echo "::endgroup::"
          done
      - name: upload crashers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.pkg }}
          path: internal/${{ matrix.pkg }}/testdata/fuzz
          if-no-files-found: ignore

  # Same goreleaser config as the tag build, minus publishing: cross-builds, archives, SBOMs.
  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: stable

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --verbose
