name: Feature request
description: Something heavyq should schedule, show, or support
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What were you running (agents, CI shells, scripts), and where did heavyq get in the way or fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Flags, config keys or output you have in mind. Say how it interacts with priorities and slots.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you use today
