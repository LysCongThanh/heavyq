# Weekly, grouped updates. Actions are pinned by commit SHA; Dependabot bumps the SHA
# and the "# vX.Y.Z" comment together. Cooldown skips releases younger than a few days.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  # tools/schemagen is its own module: the JSON Schema generator, dev only.
  - package-ecosystem: gomod
    directory: /tools/schemagen
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      schemagen:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
